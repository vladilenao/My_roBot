openapi: 3.0.3
info:
  title: My Robot — локальный API
  version: 1.7.0-proposal
  description: |
    Единый контракт всех HTTP-сервисов My Robot. Сервер встроен в робота,
    по умолчанию слушает только loopback и публикует этот файл по
    `/openapi.yaml`, Swagger UI — по `/docs`.

    * MarketDataExport — Historical Broker API Emulator забирает завершённые
      версии свечей и состояния покрытия из локального журнала, сохраняет их
      и подтверждает курсор.
    * Clusters — отчёт кластерного фильтра входа (данные ClusterSource).
    * Contours — запуск, остановка и повторный запуск торгового контура
      эмуляции командами, изменение его состава на ходу, состояние и журнал.

    Когда сервер работает: только в режиме эмуляции (торговля на живых
    данных с симулятором исполнения), сразу после раннего сбора рыночных
    данных и до выбора инструментов, если в `.env` задан хотя бы один ключ.
    Эмуляция запускается параметром `--mode emulation`, флагом `--no-prompt`
    или пунктом меню «Эмуляция». В историческом режиме (`--mode history`)
    сервер не запускается. Адрес и порт — `[market_data] export_host` и
    `export_port`.

    Ключи разные и не заменяют друг друга:
    * `ExportToken` — значение `MARKET_DATA_EXPORT_TOKEN`, экспорт и отчёт;
    * `ControlToken` — значение `ROBOT_CONTROL_TOKEN`, управление контуром.
    Ключ передаётся только в заголовке `Authorization: Bearer`.

    Как запустить торговлю командой: запустите робота с
    `--mode emulation --wait-command` (или выберите в меню «ждать команду
    API»), дождитесь строки «Робот ждёт команду запуска» и отправьте
    `POST /api/v1/contours`. Остановить — `POST /api/v1/contours/emulation/stop`;
    после остановки `POST /api/v1/contours` запускает торговлю снова, ядро
    при этом не перезапускается.

    Команды, меняющие желаемое состояние, получают номер поколения
    (`desired.generation`). Контур применяет его на ближайшей границе тика;
    команда выполнена, когда `actual.applied_generation` догнал поколение.
servers:
  - url: /
    description: Тот же узел, где опубликован Swagger UI; по умолчанию loopback.
tags:
  - name: MarketDataExport
    description: Чтение изменений локального рыночного журнала.
  - name: Clusters
    description: Отчёт кластерного фильтра входа.
  - name: Core
    description: Состояние ядра робота — пульс, рыночные данные, запросы к брокеру.
  - name: Contours
    description: |
      Запуск, остановка и повторный запуск торгового контура эмуляции,
      изменение состава на ходу, желаемое и фактическое состояние, журнал
      процесса контура.
paths:
  /openapi.yaml:
    get:
      tags: [MarketDataExport]
      summary: Машиночитаемый контракт API
      operationId: getMarketDataOpenApi
      security: []
      responses:
        '200':
          description: Действующая OpenAPI 3.0.3 спецификация.
          content:
            application/yaml:
              schema:
                type: string
  /docs:
    get:
      tags: [MarketDataExport]
      summary: Интерактивная документация Swagger UI
      operationId: getMarketDataSwaggerUi
      security: []
      responses:
        '200':
          description: Swagger UI с возможностью указать экспортный токен.
          content:
            text/html:
              schema:
                type: string
  /api/v1/market-data/source:
    get:
      tags: [MarketDataExport]
      summary: Идентичность источника и доступный диапазон курсора
      operationId: getMarketDataSource
      responses:
        '200':
          description: Идентичность локальной БД и допустимая начальная позиция.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceInfo'
              example:
                producer_id: 4b5f0d70-ef95-4929-b723-47030ec90165
                schema_version: 1
                min_after_id: 0
                max_change_id: 42
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/market-data/changes:
    get:
      tags: [MarketDataExport]
      summary: Следующая страница изменений после курсора
      operationId: getMarketDataChanges
      parameters:
        - name: producer_id
          in: query
          required: true
          description: Идентичность источника, полученная от GET /source.
          schema:
            type: string
            format: uuid
        - name: after_id
          in: query
          required: true
          description: Последний долговечно сохранённый change_id; минимум min_after_id.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Максимум изменений в странице.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        '200':
          description: Изменения отсортированы по возрастанию change_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePage'
              example:
                producer_id: 4b5f0d70-ef95-4929-b723-47030ec90165
                next_after_id: 42
                has_more: false
                changes:
                  - change_id: 42
                    kind: candle_upsert
                    recorded_at: '2026-10-09T09:02:03Z'
                    candle:
                      source: tbank_exchange
                      instrument_uid: e6123145-6bd5-43d9-8e7d-33b1a331ce43
                      interval: 1m
                      open_time_utc: '2026-10-09T09:01:00Z'
                      open: '301.50'
                      high: '302.00'
                      low: '301.25'
                      close: '301.75'
                      volume: 412
                      is_complete: true
                      revision: 1
                      received_at: '2026-10-09T09:02:03Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ProducerMismatch'
        '410':
          $ref: '#/components/responses/CursorExpired'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/market-data/consumers/{consumer_id}/checkpoint:
    put:
      tags: [MarketDataExport]
      summary: Подтвердить уже сохранённые потребителем изменения
      operationId: putMarketDataCheckpoint
      description: |
        Потребитель вызывает после commit своей БД. Повтор и меньший
        change_id не откатывают ранее подтверждённый курсор.

        Имена с префиксом `contour-` заняты курсорами торговых контуров
        робота: контур читает ленту напрямую из базы, и его курсор так же
        удерживает очистку ленты. Такое имя в запросе отклоняется с `400`.
      parameters:
        - name: consumer_id
          in: path
          required: true
          description: |
            Стабильное имя потребителя, например historical-emulator.
            Префикс `contour-` зарезервирован за торговыми контурами робота (400).
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckpointRequest'
            example:
              producer_id: 4b5f0d70-ef95-4929-b723-47030ec90165
              change_id: 42
      responses:
        '200':
          description: Последний подтверждённый курсор потребителя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckpointResponse'
              example:
                producer_id: 4b5f0d70-ef95-4929-b723-47030ec90165
                consumer_id: historical-emulator
                acknowledged_through: 42
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ProducerMismatch'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/market-data/trading-schedules:
    get:
      tags: [MarketDataExport]
      summary: Следующая страница изменений расписаний
      operationId: getTradingScheduleChanges
      parameters:
        - name: producer_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: after_id
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 0}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 1000, default: 500}
      responses:
        '200':
          description: Изменения расписаний с независимым schedule_change_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleChangePage'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/ProducerMismatch'}
  /api/v1/market-data/consumers/{consumer_id}/trading-schedules-checkpoint:
    put:
      tags: [MarketDataExport]
      summary: Подтвердить страницу отдельной ленты расписаний
      operationId: putTradingScheduleCheckpoint
      parameters:
        - name: consumer_id
          in: path
          required: true
          description: Имя потребителя; префикс `contour-` зарезервирован за торговыми контурами робота (400).
          schema: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CheckpointRequest'}
      responses:
        '200':
          description: Последний подтверждённый schedule_change_id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckpointResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/ProducerMismatch'}
  /api/v1/clusters/report:
    get:
      tags: [Clusters]
      summary: Отчёт кластерного фильтра за день или период
      description: |
        Отчёт по вердиктам кластерного фильтра для сигналов стратегий за период
        из `period` календарных дней, который заканчивается днём `date`
        включительно (день — по времени закрытия бара сигнала, МСК). Без
        `period` — отчёт за один день `date`.

        Группы вердиктов (`veto_strong`, `veto`, `confirm`, `neutral`,
        `unknown`) показывают число сигналов, сколько из них стали сделками,
        чистый итог этих сделок и движение цены через 15 и 60 минут после
        сигнала по всем сигналам группы, в том числе не ставшим сделками.
        `veto_effect` — что изменил бы запрет. `signals` — каждый сигнал
        периода с той же причиной, что была в консоли.

        Движение цены — в базисных пунктах (1 б.п. = 0,01 %) со знаком
        направления сигнала: плюс — цена пошла в сторону сигнала. Сигнал, у
        которого горизонт ещё не наступил, есть в `signals`, но не входит в
        статистику движения (`price_move.*.n` меньше `signals`).

        Ответ — `application/hal+json`: ссылки `_links.previous` и
        `_links.next` ведут на соседние периоды той же длины; клиент берёт их
        из ответа, а не собирает адрес сам.
      operationId: getClustersReport
      parameters:
        - name: date
          in: query
          required: true
          description: Последний день периода.
          schema:
            type: string
            format: date
          example: '2026-10-15'
        - name: period
          in: query
          required: false
          description: Длина периода в календарных днях, заканчивая `date` включительно.
          schema:
            type: integer
            minimum: 1
            maximum: 366
            default: 1
      responses:
        '200':
          description: Отчёт за период.
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ClustersReport'
              example:
                period: {from: '2026-10-15', to: '2026-10-15', days: 1}
                mode: shadow
                generated_at: '2026-10-15T21:00:00Z'
                horizons_min: [15, 60]
                groups:
                  - verdict: veto
                    signals: 1
                    trades: 1
                    trades_net_pnl: {amount: '-1455.94', currency: RUB}
                    trades_won: 0
                    trades_lost: 1
                    price_move:
                      '15': {n: 1, mean_bps: '-39.11', median_bps: '-39.11', hit_rate: '0.00'}
                      '60': {n: 1, mean_bps: '-74.27', median_bps: '-74.27', hit_rate: '0.00'}
                veto_effect:
                  includes: [veto_strong, veto]
                  trades_removed: 1
                  winners_removed: 0
                  winners_net_pnl: {amount: '0.00', currency: RUB}
                  losers_removed: 1
                  losers_net_pnl: {amount: '-1455.94', currency: RUB}
                  net_effect: {amount: '1455.94', currency: RUB}
                signals:
                  - signal_id: 'future-br-macd:BRX6:5m:2026-10-15T13:50:00:SELL'
                    bar_close: '2026-10-15T13:50:00Z'
                    instrument: BRX6
                    assignment_id: future-br-macd
                    strategy: macd_rsi_stoch
                    timeframe: 5m
                    side: SELL
                    price: '104.63'
                    verdict: veto
                    reason: climax
                    message: 'Вход на кульминации: ход до входа +2,16σ (порог 1,5σ) · середина 2ч диапазона · 16:40 всплеск продаж ×9,6 после хода +2,45σ'
                    trade:
                      trade_id: 'future-br-macd:BRX6:5m:2026-10-15T13:50:00:SELL'
                      net_pnl: {amount: '-1455.94', currency: RUB}
                    price_move:
                      '15': {status: final, move_bps: '-39.11'}
                      '60': {status: final, move_bps: '-74.27'}
                _links:
                  self: {href: '/api/v1/clusters/report?date=2026-10-15&period=1'}
                  previous: {href: '/api/v1/clusters/report?date=2026-10-14&period=1'}
        '400':
          description: Неверная дата или длина периода.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: BAD_PERIOD
                message: Дата отчёта позже сегодняшней.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503':
          description: База сделок или кластерных событий робота временно недоступна.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/core:
    get:
      tags: [Core]
      summary: Состояние ядра
      description: |
        Версия и pid ядра, пульс для контуров, сводка готовности живых пар
        и запросы к брокеру за последнюю минуту по сервисам и полосам.
        Секретов, адресов и токенов в ответе нет.
      operationId: getCore
      security:
        - ControlToken: []
      responses:
        '200':
          description: Состояние ядра.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoreState'}
              example:
                version: 7.1.0
                pid: 4242
                started_at: '2026-10-24T09:00:00Z'
                heartbeat: {beat_at: '2026-10-24T11:02:05Z', interval_secs: 5}
                market_data:
                  producer_id: tbank-7f3a
                  max_change_id: 812345
                  pairs: {total: 14, by_status: {READY: 13, BOOTSTRAPPING: 1}}
                quotas:
                  quotes: {per_minute: 41, ceiling: 180, lanes: {live: 30, evidence: 11}, retry_after: null}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}
        '404':
          description: Процесс без ядра — состояние недоступно.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /api/v1/contours:
    get:
      tags: [Contours]
      summary: Состояние торговых контуров процесса
      description: |
        В режиме эмуляции список содержит ровно один контур `emulation`:
        ждёт ли он команды, запускается или торгует, какими контрактами и
        откуда пришёл запуск. Сделок, баланса и секретов в ответе нет.
      operationId: listContours
      security:
        - ControlToken: []
      responses:
        '200':
          description: Контуры процесса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContourList'
              examples:
                waiting:
                  summary: Робот ждёт команду
                  value:
                    contours:
                      - id: emulation
                        kind: emulation
                        state: waiting_command
                        source: null
                        instruments: []
                        started_at: null
                        command: null
                        rejections: []
                        pid: null
                        exit_code: null
                        desired: null
                        recovery: null
                        actual: null
                        members: []
                running:
                  summary: Торговля запущена командой
                  value:
                    contours:
                      - id: emulation
                        kind: emulation
                        state: running
                        source: api
                        instruments:
                          - {token: NG, name: NG-12.26, instrument_type: future, days_to_expiry: 52}
                          - {token: SBER, name: SBER, instrument_type: share, days_to_expiry: null}
                        started_at: '2026-10-22T10:15:00Z'
                        command: --mode emulation --instruments NG-12.26,SBER
                        rejections: []
                        pid: 81412
                        exit_code: null
                        desired: {running: true, stop_mode: null, generation: 1}
                        recovery: null
                        actual:
                          state: running
                          applied_generation: 1
                          open_positions: 1
                          pending_entries: 0
                          last_tick_at: '2026-10-22T10:16:00Z'
                          core_link: ok
                        members:
                          - {name: NG-12.26, instrument_type: future, desired: active, remove_mode: null, actual: trading}
                adopted:
                  summary: После рестарта ядра подхвачен живой контур
                  value:
                    contours:
                      - id: emulation
                        kind: emulation
                        state: running
                        source: api
                        instruments:
                          - {token: NG, name: NG-12.26, instrument_type: future, days_to_expiry: 52}
                        started_at: '2026-10-24T09:00:05Z'
                        command: --mode emulation --instruments NG-12.26
                        rejections: []
                        pid: 81412
                        exit_code: null
                        desired: {running: true, stop_mode: null, generation: 7}
                        recovery: adopted
                        actual:
                          state: running
                          applied_generation: 7
                          open_positions: 1
                          pending_entries: 0
                          last_tick_at: '2026-10-24T09:01:00Z'
                          core_link: ok
                        members:
                          - {name: NG-12.26, instrument_type: future, desired: active, remove_mode: null, actual: trading}
                stopping:
                  summary: Контур доживает сделки после stop no_entries
                  value:
                    contours:
                      - id: emulation
                        kind: emulation
                        state: stopping_no_entries
                        source: api
                        instruments:
                          - {token: NG, name: NG-12.26, instrument_type: future, days_to_expiry: 52}
                        started_at: '2026-10-22T10:15:00Z'
                        command: --mode emulation --instruments NG-12.26
                        rejections: []
                        pid: 81412
                        exit_code: null
                        desired: {running: false, stop_mode: no_entries, generation: 2}
                        recovery: null
                        actual:
                          state: stopping_no_entries
                          applied_generation: 2
                          open_positions: 1
                          pending_entries: 0
                          last_tick_at: '2026-10-22T11:02:00Z'
                          core_link: ok
                        members:
                          - {name: NG-12.26, instrument_type: future, desired: active, remove_mode: null, actual: trading}
                failed:
                  summary: Процесс контура упал
                  value:
                    contours:
                      - id: emulation
                        kind: emulation
                        state: failed
                        source: api
                        instruments:
                          - {token: NG, name: NG-12.26, instrument_type: future, days_to_expiry: 52}
                        started_at: '2026-10-22T10:15:00Z'
                        command: --mode emulation --instruments NG-12.26
                        rejections: []
                        pid: null
                        exit_code: 1
                        desired: {running: true, stop_mode: null, generation: 1}
                        recovery: null
                        actual: null
                        members: []
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}
    post:
      tags: [Contours]
      summary: Запустить торговлю эмуляции выбранными инструментами
      description: |
        Работает, когда робот ждёт команду: запущен с `--mode emulation
        --wait-command` и ещё не торгует, либо контур уже остановлен
        (`stopped`) или упал (`failed`) — тогда ядро запускает процесс
        контура заново, приём данных не перезапускается, набор может быть
        другим. Принятая команда записывает желаемое «работает» новым
        поколением. Инструменты разрешаются по тем же правилам, что
        параметр `--instruments`:

        * `all` или поле не задано — все инструменты с привязками в `robot.toml`;
        * тикер акции — `SBER`;
        * код или префикс семейства фьючерсов — `NG`, `RTS`/`RI`, `SBRF`/`SR`:
          берётся ближайший контракт, до экспирации которого больше
          `contract_expiry_block_days` суток;
        * контракт коротким именем `NG-12.26` или биржевым тикером.

        Отказ строгий: если хотя бы один токен отклонён, торговля не
        начинается ни по одному инструменту (`422`), робот продолжает ждать.
        Проверка у брокера ограничена 60 секундами; если не уложилась —
        `202`, итог виден в `GET /api/v1/contours`.
      operationId: startContour
      security:
        - ControlToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContourLaunchRequest'
            examples:
              gasAndSber:
                summary: Газ и Сбер
                value: {kind: emulation, instruments: [NG, SBER]}
              explicitContract:
                summary: Конкретный контракт
                value: {kind: emulation, instruments: [NG-03.27]}
              everything:
                summary: Все инструменты с привязками
                value: {kind: emulation}
      responses:
        '201':
          description: |
            Инструменты разрешены, ядро записало файл запуска и запустило
            процесс контура (`--contour emulation`). Состояние `starting`
            сменится на `running`, когда контур первый раз подтвердит курсор
            ленты; следить — `GET /api/v1/contours`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contour'
              example:
                id: emulation
                kind: emulation
                state: starting
                source: api
                instruments:
                  - {token: NG, name: NG-12.26, instrument_type: future, days_to_expiry: 52}
                  - {token: SBER, name: SBER, instrument_type: share, days_to_expiry: null}
                started_at: '2026-10-22T10:15:00Z'
                command: --mode emulation --instruments NG-12.26,SBER
                rejections: []
                pid: 81412
                exit_code: null
                desired: {running: true, stop_mode: null, generation: 1}
                recovery: null
                actual: null
                members: []
        '202':
          description: Проверка инструментов у брокера ещё идёт; итог — в `GET /api/v1/contours`.
          headers:
            Location:
              schema: {type: string, example: /api/v1/contours}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contour'
              example:
                id: emulation
                kind: emulation
                state: starting
                source: api
                instruments: []
                started_at: null
                command: null
                rejections: []
                pid: null
                exit_code: null
                desired: null
                recovery: null
                actual: null
                members: []
        '400':
          description: Тело не JSON, неизвестные поля, `kind` не `emulation` или `instruments` не список строк.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: UNSUPPORTED_KIND
                message: В этом процессе командой запускается только эмуляция.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}
        '409':
          description: |
            `ALREADY_RUNNING` — контур запускается или торгует (командой,
            параметрами или меню); `STOPPING` — контур выполняет остановку и
            доживает сделки: дождитесь `stopped` или вызовите stop с `close_all`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContourConflict'
              example:
                code: ALREADY_RUNNING
                message: Контур эмуляции уже торгует; набор инструментов не изменён.
                contour:
                  id: emulation
                  kind: emulation
                  state: running
                  source: cli
                  instruments:
                    - {token: NG, name: NG-12.26, instrument_type: future, days_to_expiry: 52}
                  started_at: '2026-10-22T09:00:00Z'
                  command: --mode emulation --instruments NG-12.26
                  rejections: []
                  pid: 81412
                  exit_code: null
                  desired: {running: true, stop_mode: null, generation: 1}
                  recovery: null
                  actual: null
                  members: []
        '422':
          description: Хотя бы один инструмент отклонён; торговля не начата, робот ждёт новую команду.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaunchRejected'
              example:
                code: INSTRUMENTS_REJECTED
                message: Торговля не запущена.
                rejections:
                  - {token: AFLT, reason: У инструмента нет привязок в robot.toml.}
  /api/v1/contours/{contour_id}:
    parameters:
      - $ref: '#/components/parameters/ContourId'
    get:
      tags: [Contours]
      summary: Состояние одного контура
      operationId: getContour
      security:
        - ControlToken: []
      responses:
        '200':
          description: Контур, тот же объект, что в списке.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Contour'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}
        '404': {$ref: '#/components/responses/ContourNotFound'}
  /api/v1/contours/{contour_id}/stop:
    parameters:
      - $ref: '#/components/parameters/ContourId'
    post:
      tags: [Contours]
      summary: Остановить контур
      description: |
        Записывает желаемое «остановлен» с режимом и новым поколением.
        Контур применяет его на ближайшей границе тика (не реже раза в
        минуту), ядро, приём данных и API продолжают работать.

        * `no_entries` — новых входов и доборов нет, неисполненные входы
          снимаются, открытые позиции сопровождаются до закрытия; после
          последней процесс контура завершается сам.
        * `close_all` — то же, и все позиции закрываются на открытии
          следующего бара; затем контур завершается.

        Повтор той же команды безопасен (`200`, поколение прежнее).
        `close_all` поверх `no_entries` принимается, обратно — `409`.
        Ctrl+C в консоли ядра останавливает процесс контура, не меняя
        желаемое.
      operationId: stopContour
      security:
        - ControlToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContourStopRequest'}
            examples:
              noEntries:
                summary: Больше не входить, сделки доживают
                value: {mode: no_entries}
              closeAll:
                summary: Закрыть всё
                value: {mode: close_all}
      responses:
        '202':
          description: Остановка записана новым поколением; выполнение — по `actual.applied_generation`.
          headers:
            Location:
              schema: {type: string, example: /api/v1/contours/emulation}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContourStopAccepted'}
              example:
                generation: 2
                contour:
                  id: emulation
                  kind: emulation
                  state: stopping_no_entries
                  source: api
                  instruments:
                    - {token: NG, name: NG-12.26, instrument_type: future, days_to_expiry: 52}
                  started_at: '2026-10-22T10:15:00Z'
                  command: --mode emulation --instruments NG-12.26
                  rejections: []
                  pid: 81412
                  exit_code: null
                  desired: {running: false, stop_mode: no_entries, generation: 2}
                  recovery: null
                  actual:
                    state: running
                    applied_generation: 1
                    open_positions: 1
                    pending_entries: 0
                    last_tick_at: '2026-10-22T11:01:00Z'
                    core_link: ok
                  members:
                    - {name: NG-12.26, instrument_type: future, desired: active, remove_mode: null, actual: trading}
        '200':
          description: Повтор той же остановки; поколение не изменилось.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContourStopAccepted'}
        '400':
          description: 'Тело не `{"mode": "no_entries" | "close_all"}`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}
        '404': {$ref: '#/components/responses/ContourNotFound'}
        '409':
          description: |
            `NOT_RUNNING` — процесс контура не работает (`waiting_command`,
            `stopped`, `failed`); `MODE_CONFLICT` — `no_entries` поверх
            `close_all`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContourConflict'}
  /api/v1/contours/{contour_id}/instruments:
    parameters:
      - $ref: '#/components/parameters/ContourId'
    post:
      tags: [Contours]
      summary: Изменить состав работающего контура
      description: |
        Добавляет или убирает инструменты без перезапуска контура. Тело
        содержит ровно одно из полей:

        * `add` — токены по тем же правилам, что у `POST /api/v1/contours`
          (тикер акции, код семейства — ближайший контракт, контракт). Отказ
          строгий: хотя бы один токен отклонён — состав не меняется (`422`).
          Новый инструмент сначала прогревается (`warming`), затем проходит
          стартовый обзор и торгует.
        * `remove` — короткое имя контракта, тикер акции или код семейства,
          если в составе ровно один его контракт. `mode`: `no_entries`
          (по умолчанию) — новых входов нет, неисполненные входы снимаются,
          позиции доживают; `close_all` — позиции закрываются на открытии
          следующего бара. Без сделок инструмент выходит из состава.

        Изменение получает новое поколение и применяется на ближайшей
        границе тика. Повтор без изменений — `200`. `add` убираемого
        инструмента возвращает его в торговлю.
      operationId: changeContourInstruments
      security:
        - ControlToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContourMembershipRequest'}
            examples:
              addGas:
                summary: Добавить газ
                value: {add: [NG]}
              removeSber:
                summary: Убрать Сбер, сделки доживают
                value: {remove: [SBER]}
              closeGas:
                summary: Убрать газ и закрыть его позиции
                value: {remove: [NG-12.26], mode: close_all}
      responses:
        '202':
          description: Изменение записано новым поколением; выполнение — по `members[].actual` и `actual.applied_generation`.
          headers:
            Location:
              schema: {type: string, example: /api/v1/contours/emulation}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContourMembershipAccepted'}
              example:
                generation: 2
                contour:
                  id: emulation
                  kind: emulation
                  state: running
                  source: api
                  instruments:
                    - {token: SBER, name: SBER, instrument_type: share, days_to_expiry: null}
                    - {token: NG, name: NG-12.26, instrument_type: future, days_to_expiry: 52}
                  started_at: '2026-10-24T10:15:00Z'
                  command: --mode emulation --instruments SBER
                  rejections: []
                  pid: 81412
                  exit_code: null
                  desired: {running: true, stop_mode: null, generation: 2}
                  recovery: null
                  actual:
                    state: running
                    applied_generation: 1
                    open_positions: 0
                    pending_entries: 0
                    last_tick_at: '2026-10-24T11:01:00Z'
                    core_link: ok
                  members:
                    - {name: SBER, instrument_type: share, desired: active, remove_mode: null, actual: trading}
                    - {name: NG-12.26, instrument_type: future, desired: active, remove_mode: null, actual: null}
        '200':
          description: Команда ничего не меняет (повтор); поколение прежнее.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContourMembershipAccepted'}
        '400':
          description: 'Тело не `{"add": [...]}` и не `{"remove": [...], "mode": ...}`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}
        '404': {$ref: '#/components/responses/ContourNotFound'}
        '409':
          description: |
            `NOT_RUNNING` — процесс контура не работает; `STOPPING` — контур
            выполняет остановку; `MODE_CONFLICT` — `no_entries` поверх
            `close_all` у убираемого инструмента.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContourConflict'}
        '422':
          description: Хотя бы один токен не разрешён или инструмента нет в составе; состав не изменён.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LaunchRejected'}
              example:
                code: INSTRUMENTS_REJECTED
                message: Состав не изменён.
                rejections:
                  - {token: GAZP, reason: Инструмента нет в составе контура.}
  /api/v1/contours/{contour_id}/log:
    parameters:
      - $ref: '#/components/parameters/ContourId'
    get:
      tags: [Contours]
      summary: Последние строки журнала процесса контура
      description: |
        Строки `data/contours/<id>/bot_debug.log` так, как они записаны:
        секреты в журнале уже заменены на `[скрыто]`. Нет журнала — пустой
        ответ.
      operationId: getContourLog
      security:
        - ControlToken: []
      parameters:
        - name: tail
          in: query
          required: false
          description: Сколько последних строк вернуть.
          schema: {type: integer, minimum: 1, maximum: 1000, default: 200}
      responses:
        '200':
          description: Последние строки журнала.
          content:
            text/plain:
              schema: {type: string}
              example: |
                2026-10-22 11:02:00 [INFO] src.assembly.contour_control: Контур emulation: поколение 2 — остановка no_entries
        '400':
          description: '`tail` не целое число от 1 до 1000.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}
        '404': {$ref: '#/components/responses/ContourNotFound'}
components:
  parameters:
    ContourId:
      name: contour_id
      in: path
      required: true
      description: Идентификатор контура; в этой версии — `emulation`.
      schema: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$', example: emulation}
  securitySchemes:
    ExportToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Отдельный токен чтения и подтверждения экспортного потока.
    ControlToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Ключ управления контуром — значение `ROBOT_CONTROL_TOKEN` из `.env`.
        Не даёт доступа к экспорту, а ключ экспорта не даёт управления.
  responses:
    ContourNotFound:
      description: Неизвестный идентификатор контура.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
          example: {code: NOT_FOUND, message: "Контура 'account' нет."}
    BadRequest:
      description: Неверный параметр или идентификатор вне допустимого диапазона.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Токен отсутствует или неверен.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ProducerMismatch:
      description: Курсор относится к другой локальной БД My Robot.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: PRODUCER_MISMATCH
            message: Запрошенный producer_id не совпадает с текущим.
    CursorExpired:
      description: Курсор старше сохранённого диапазона; требуется сверка.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: CURSOR_EXPIRED
            message: Часть журнала изменений недоступна; выполните сверку.
    ForbiddenHost:
      description: Заголовок `Host` не loopback-адрес сервера; команда отклонена.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: FORBIDDEN_HOST
            message: Управление доступно только по адресу 127.0.0.1, localhost или [::1].
    Unavailable:
      description: Локальное рыночное хранилище временно недоступно.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    SourceInfo:
      type: object
      additionalProperties: false
      required: [producer_id, schema_version, min_after_id, max_change_id]
      properties:
        producer_id:
          type: string
          format: uuid
          description: Постоянен до пересоздания локальной БД.
        schema_version:
          type: integer
          minimum: 1
        min_after_id:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Наименьший курсор, с которого доступна полная выдача. Растёт по
            правилу хранения ленты ([market_data] changes_retention_days), но
            не дальше наименьшего подтверждённого курсора потребителей;
            курсор меньше него получает 410.
        max_change_id:
          type: integer
          format: int64
          minimum: 0
    ChangePage:
      type: object
      additionalProperties: false
      required: [producer_id, next_after_id, has_more, changes]
      properties:
        producer_id:
          type: string
          format: uuid
        next_after_id:
          type: integer
          format: int64
          minimum: 0
          description: Последний change_id страницы либо исходный after_id при пустом ответе.
        has_more:
          type: boolean
        changes:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/CandleChange'
              - $ref: '#/components/schemas/IntervalStatusChange'
    ScheduleChangePage:
      type: object
      additionalProperties: false
      required: [producer_id, next_after_id, has_more, changes]
      properties:
        producer_id:
          type: string
          format: uuid
        next_after_id:
          type: integer
          format: int64
          minimum: 0
          description: Последний change_id страницы (schedule_change_id) либо исходный after_id при пустом ответе.
        has_more:
          type: boolean
        changes:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/ScheduleDayChange'
              - $ref: '#/components/schemas/ScheduleBindingChange'
    ScheduleDayChange:
      type: object
      additionalProperties: false
      required: [change_id, kind, source, exchange, observed_at, day]
      properties:
        change_id: {type: integer, format: int64, minimum: 1}
        kind: {type: string, enum: [schedule_day]}
        source: {type: string, example: tbank}
        exchange:
          type: string
          description: Код режима торгов в нижнем регистре.
          example: moex_mrng_evng_e_wknd_dlr
        observed_at: {type: string, format: date-time}
        day:
          type: object
          additionalProperties: false
          required: [trading_date, version, raw_json, is_trading_day, last_confirmed_at]
          properties:
            trading_date: {type: string, format: date, description: Торговая дата по МСК.}
            version: {type: string, description: sha256 канонического JSON исходного TradingDay.}
            raw_json: {type: string, description: Канонический JSON исходного TradingDay (UTC ISO).}
            is_trading_day: {type: boolean}
            last_confirmed_at: {type: string, format: date-time}
    ScheduleBindingChange:
      type: object
      additionalProperties: false
      required: [change_id, kind, source, exchange, instrument_uid, observed_at]
      properties:
        change_id: {type: integer, format: int64, minimum: 1}
        kind: {type: string, enum: [schedule_binding]}
        source: {type: string, example: tbank}
        exchange: {type: string, description: Код режима торгов в нижнем регистре.}
        instrument_uid: {type: string}
        observed_at: {type: string, format: date-time}
    CandleChange:
      type: object
      additionalProperties: false
      required: [change_id, kind, recorded_at, candle]
      properties:
        change_id:
          type: integer
          format: int64
          minimum: 1
        kind:
          type: string
          enum: [candle_upsert]
        recorded_at:
          type: string
          format: date-time
        candle:
          $ref: '#/components/schemas/CompleteCandle'
    IntervalStatusChange:
      type: object
      additionalProperties: false
      required: [change_id, kind, recorded_at, interval_status]
      properties:
        change_id:
          type: integer
          format: int64
          minimum: 1
        kind:
          type: string
          enum: [interval_status]
        recorded_at:
          type: string
          format: date-time
        interval_status:
          $ref: '#/components/schemas/IntervalStatus'
    CompleteCandle:
      type: object
      additionalProperties: false
      required: [source, instrument_uid, interval, open_time_utc, open, high, low, close, volume, is_complete, revision, received_at]
      properties:
        source:
          type: string
          description: Идентификатор брокерского источника и типа свечи.
        instrument_uid:
          type: string
          minLength: 1
        interval:
          type: string
          minLength: 1
          example: 1m
        open_time_utc:
          type: string
          format: date-time
        open:
          $ref: '#/components/schemas/DecimalPrice'
        high:
          $ref: '#/components/schemas/DecimalPrice'
        low:
          $ref: '#/components/schemas/DecimalPrice'
        close:
          $ref: '#/components/schemas/DecimalPrice'
        volume:
          type: integer
          format: int64
          minimum: 0
        is_complete:
          type: boolean
          enum: [true]
        revision:
          type: integer
          minimum: 1
        received_at:
          type: string
          format: date-time
    DecimalPrice:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      description: Десятичное число строкой для сохранения точности.
      example: '301.75'
    IntervalStatus:
      type: object
      additionalProperties: false
      required: [source, instrument_uid, interval, open_time_utc, state, observed_at, evidence]
      properties:
        source:
          type: string
        instrument_uid:
          type: string
          minLength: 1
        interval:
          type: string
          example: 1m
        open_time_utc:
          type: string
          format: date-time
        state:
          type: string
          enum: [received, scheduled_closed, confirmed_no_trade, pending, unresolved]
        observed_at:
          type: string
          format: date-time
        evidence:
          type: string
          minLength: 1
          description: Источник и основание классификации интервала.
    CheckpointRequest:
      type: object
      additionalProperties: false
      required: [producer_id, change_id]
      properties:
        producer_id:
          type: string
          format: uuid
        change_id:
          type: integer
          format: int64
          minimum: 0
    CheckpointResponse:
      type: object
      additionalProperties: false
      required: [producer_id, consumer_id, acknowledged_through]
      properties:
        producer_id:
          type: string
          format: uuid
        consumer_id:
          type: string
        acknowledged_through:
          type: integer
          format: int64
          minimum: 0
    ContourLaunchRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [emulation]
          description: Вид контура. В этой версии командой запускается только эмуляция.
        instruments:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
          description: Токены инструментов; без поля — `all`.
    ContourInstrument:
      type: object
      additionalProperties: false
      required: [token, name, instrument_type, days_to_expiry]
      properties:
        token: {type: string, description: Токен из команды.}
        name: {type: string, description: Короткое имя контракта или тикер акции.}
        instrument_type: {type: string, enum: [share, future]}
        days_to_expiry:
          type: integer
          nullable: true
          description: Суток до экспирации контракта; у акции — null.
    LaunchRejection:
      type: object
      additionalProperties: false
      required: [token, reason]
      properties:
        token: {type: string}
        reason: {type: string}
    CoreState:
      type: object
      additionalProperties: false
      required: [version, pid, started_at, heartbeat, market_data, quotas]
      properties:
        version: {type: string, example: 7.1.0}
        pid: {type: integer}
        started_at: {type: string, format: date-time, nullable: true}
        heartbeat:
          type: object
          nullable: true
          additionalProperties: false
          required: [beat_at, interval_secs]
          description: Последний удар пульса в `core.sqlite3`; контуры без свежего удара не входят в новые сделки.
          properties:
            beat_at: {type: string, format: date-time, nullable: true}
            interval_secs: {type: integer, minimum: 1}
        market_data:
          type: object
          nullable: true
          additionalProperties: false
          required: [producer_id, max_change_id, pairs]
          properties:
            producer_id: {type: string}
            max_change_id: {type: integer, minimum: 0}
            pairs:
              type: object
              additionalProperties: false
              required: [total, by_status]
              properties:
                total: {type: integer, minimum: 0}
                by_status:
                  type: object
                  description: Число живых пар по состоянию готовности (`READY`, `BOOTSTRAPPING` и т. д.).
                  additionalProperties: {type: integer, minimum: 0}
        quotas:
          type: object
          description: Запросы к брокеру за последнюю минуту по сервисам (`quotes`, `instruments`).
          additionalProperties:
            type: object
            additionalProperties: false
            required: [per_minute, ceiling, lanes, retry_after]
            properties:
              per_minute: {type: integer, minimum: 0}
              ceiling: {type: integer, nullable: true}
              lanes:
                type: object
                additionalProperties: {type: integer, minimum: 0}
              retry_after:
                type: string
                format: date-time
                nullable: true
                description: До какого момента сервис на паузе после ограничения брокера.
    Contour:
      type: object
      additionalProperties: false
      required: [id, kind, state, source, instruments, started_at, command, rejections, pid, exit_code, desired,
                 recovery, actual, members]
      properties:
        id: {type: string, example: emulation}
        kind: {type: string, enum: [emulation]}
        state:
          type: string
          enum: [waiting_command, starting, running, stopping_no_entries, stopping_close_all, stopped, failed]
          description: |
            `starting` — процесс контура запущен, но ещё не подтвердил курсор
            ленты; `running` — контур торгует; `stopping_no_entries` /
            `stopping_close_all` — процесс жив, а желаемое — остановка в этом
            режиме; `stopped` — процесс завершился штатно (код 0);
            `failed` — завершился с другим кодом или не запустился, сам не
            перезапускается до следующего старта ядра. После рестарта ядра
            контур поднимается сам (`recovery: autostart`) или подхватывается
            живым (`recovery: adopted`); `waiting_command` с прежним
            желаемым — только если желаемое не «работает» или
            `[contours] autostart = false`.
        source:
          type: string
          nullable: true
          enum: [cli, menu, api, null]
          description: Откуда пришёл запуск; null, пока робот ждёт команду.
        instruments:
          type: array
          description: Текущий желаемый активный состав; после команд состава — уже новый, а не состав запуска.
          items: {$ref: '#/components/schemas/ContourInstrument'}
        started_at:
          type: string
          format: date-time
          nullable: true
        command:
          type: string
          nullable: true
          description: Эквивалентная команда запуска; контракты коротким именем.
        rejections:
          type: array
          description: Отказы последней отклонённой команды.
          items: {$ref: '#/components/schemas/LaunchRejection'}
        pid:
          type: integer
          nullable: true
          description: PID процесса контура, пока он жив (контур — отдельный процесс, `--contour emulation`).
        exit_code:
          type: integer
          nullable: true
          description: Код выхода процесса контура после его завершения; у подхваченного процесса неизвестен — null.
        recovery:
          type: string
          nullable: true
          enum: [autostart, adopted, null]
          description: |
            Как этот запуск ядра получил процесс: `autostart` — поднят без
            команды по желаемому из `core.sqlite3`, `adopted` — подхвачен
            живым процессом той же версии; null — запущен командой или
            параметрами.
        desired:
          allOf: [{$ref: '#/components/schemas/ContourDesired'}]
          nullable: true
          description: Желаемое из `data/core.sqlite3`; null, если контур ни разу не запускался.
        actual:
          allOf: [{$ref: '#/components/schemas/ContourActual'}]
          nullable: true
          description: Фактическое из `status.json` контура; null до первого снимка этого запуска ядра или если файл не читается.
        members:
          type: array
          description: Все инструменты желаемого состава, включая убираемые, с фактическим состоянием контура.
          items: {$ref: '#/components/schemas/ContourMember'}
    ContourMember:
      type: object
      additionalProperties: false
      required: [name, instrument_type, desired, remove_mode, actual]
      properties:
        name: {type: string, description: Короткое имя контракта или тикер акции.}
        instrument_type: {type: string, enum: [share, future]}
        desired: {type: string, enum: [active, removed]}
        remove_mode:
          type: string
          nullable: true
          enum: [no_entries, close_all, null]
        actual:
          type: string
          nullable: true
          enum: [warming, trading, draining, closing, null]
          description: |
            `warming` — ядро прогревает пары; `trading` — анализ и входы;
            `draining` / `closing` — убирается, сделки доживают или
            закрываются. `null` — контур ещё не применил изменение или
            инструмент уже вышел из состава.
    ContourMembershipRequest:
      type: object
      additionalProperties: false
      description: Ровно одно из полей `add` и `remove`; `mode` — только вместе с `remove`.
      properties:
        add:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
        remove:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
        mode: {type: string, enum: [no_entries, close_all], default: no_entries}
    ContourMembershipAccepted:
      type: object
      additionalProperties: false
      required: [generation, contour]
      properties:
        generation:
          type: integer
          minimum: 1
          nullable: true
          description: Поколение изменения; null — разрешение ещё идёт (не уложилось в 60 с).
        contour: {$ref: '#/components/schemas/Contour'}
    ContourDesired:
      type: object
      additionalProperties: false
      required: [running, stop_mode, generation]
      properties:
        running: {type: boolean, description: Должен ли контур торговать.}
        stop_mode:
          type: string
          nullable: true
          enum: [no_entries, close_all, null]
        generation: {type: integer, minimum: 1, description: Номер поколения желаемого состояния.}
    ContourActual:
      type: object
      additionalProperties: false
      required: [state, applied_generation, open_positions, pending_entries, last_tick_at, core_link]
      properties:
        state:
          type: string
          enum: [running, stopping_no_entries, stopping_close_all, stopped]
        applied_generation: {type: integer, minimum: 0, description: 'Поколение, которое контур применил.'}
        open_positions: {type: integer, minimum: 0}
        pending_entries: {type: integer, minimum: 0, description: Неисполненные входы.}
        last_tick_at:
          type: string
          format: date-time
          nullable: true
        core_link:
          type: string
          nullable: true
          enum: [ok, lost, null]
          description: |
            Видит ли контур пульс ядра; `lost` — удара нет дольше
            `[contours] heartbeat_timeout_secs`, новые входы запрещены
            (`core-lost`). null — снимок контура версии до пульса.
    ContourStopRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: {type: string, enum: [no_entries, close_all]}
    ContourStopAccepted:
      type: object
      additionalProperties: false
      required: [generation, contour]
      properties:
        generation: {type: integer, minimum: 1}
        contour: {$ref: '#/components/schemas/Contour'}
    ContourList:
      type: object
      additionalProperties: false
      required: [contours]
      properties:
        contours:
          type: array
          items: {$ref: '#/components/schemas/Contour'}
    ContourConflict:
      type: object
      additionalProperties: false
      required: [code, message, contour]
      properties:
        code:
          type: string
          enum: [ALREADY_RUNNING, STOPPING, NOT_RUNNING, MODE_CONFLICT]
        message: {type: string}
        contour: {$ref: '#/components/schemas/Contour'}
    LaunchRejected:
      type: object
      additionalProperties: false
      required: [code, message, rejections]
      properties:
        code: {type: string, example: INSTRUMENTS_REJECTED}
        message: {type: string}
        rejections:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/LaunchRejection'}
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          example: CURSOR_EXPIRED
        message:
          type: string
    Decimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      description: Десятичное число строкой.
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount: {$ref: '#/components/schemas/Decimal'}
        currency: {type: string, example: RUB}
    HalLink:
      type: object
      additionalProperties: false
      required: [href]
      properties:
        href:
          type: string
          description: Относительный адрес ресурса.
    ClusterVerdict:
      type: string
      enum: [veto_strong, veto, confirm, neutral, unknown]
      description: |
        veto_strong — запрет и цена у края 2ч диапазона по направлению входа;
        veto — запрет; confirm — подтверждение; neutral — без влияния;
        unknown — кластерных данных нет, вход пропущен как без фильтра.
    ClusterVerdictReason:
      type: string
      enum: [climax, initiative, no_evidence, no_coverage, contract_mismatch, data_degraded, consumer_lag, no_sigma_history, candles_missing]
    PriceMoveStats:
      type: object
      additionalProperties: false
      required: [n]
      properties:
        n:
          type: integer
          minimum: 0
          description: Сигналов, у которых горизонт уже наступил.
        mean_bps:
          allOf: [{$ref: '#/components/schemas/Decimal'}]
          nullable: true
        median_bps:
          allOf: [{$ref: '#/components/schemas/Decimal'}]
          nullable: true
        hit_rate:
          allOf: [{$ref: '#/components/schemas/Decimal'}]
          nullable: true
          description: Доля сигналов, после которых цена пошла в их сторону (0..1).
    PriceMove:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, final, no_data]
        move_bps:
          allOf: [{$ref: '#/components/schemas/Decimal'}]
          nullable: true
    ClustersReportGroup:
      type: object
      additionalProperties: false
      required: [verdict, signals, trades, trades_net_pnl, trades_won, trades_lost, price_move]
      properties:
        verdict: {$ref: '#/components/schemas/ClusterVerdict'}
        signals: {type: integer, minimum: 0}
        trades:
          type: integer
          minimum: 0
          description: Сколько сигналов группы стали сделкой (есть исполнение).
        trades_net_pnl: {$ref: '#/components/schemas/Money'}
        trades_won: {type: integer, minimum: 0}
        trades_lost: {type: integer, minimum: 0}
        price_move:
          type: object
          description: Ключ — горизонт в минутах из horizons_min.
          additionalProperties: {$ref: '#/components/schemas/PriceMoveStats'}
    ClustersReportSignal:
      type: object
      additionalProperties: false
      required: [signal_id, bar_close, instrument, assignment_id, strategy, timeframe, side, price, verdict, reason, message, trade, price_move]
      properties:
        signal_id:
          type: string
          description: Идентификатор входного события стратегии; по нему вердикт связан со сделкой.
        bar_close: {type: string, format: date-time}
        instrument:
          type: string
          description: Тикер контракта или акции (BRX6, SBER).
        assignment_id: {type: string}
        strategy: {type: string}
        timeframe: {type: string, example: 5m}
        side:
          type: string
          enum: [BUY, SELL]
        price: {$ref: '#/components/schemas/Decimal'}
        verdict: {$ref: '#/components/schemas/ClusterVerdict'}
        reason: {$ref: '#/components/schemas/ClusterVerdictReason'}
        message:
          type: string
          description: Тот же текст, что был в консоли в строке «Кластеры».
        trade:
          type: object
          nullable: true
          description: null — сигнал не стал сделкой.
          additionalProperties: false
          required: [trade_id, net_pnl]
          properties:
            trade_id: {type: string}
            net_pnl:
              allOf: [{$ref: '#/components/schemas/Money'}]
              nullable: true
              description: null — сделка ещё открыта.
        price_move:
          type: object
          additionalProperties: {$ref: '#/components/schemas/PriceMove'}
    ClustersReport:
      type: object
      additionalProperties: false
      required: [period, mode, generated_at, horizons_min, groups, veto_effect, signals, _links]
      properties:
        period:
          type: object
          additionalProperties: false
          required: [from, to, days]
          properties:
            from: {type: string, format: date}
            to: {type: string, format: date}
            days: {type: integer, minimum: 1}
        mode:
          type: string
          enum: [off, shadow, enforce, mixed]
          description: Режим фильтра у привязок в периоде; mixed — режимы различались.
        generated_at: {type: string, format: date-time}
        horizons_min:
          type: array
          items: {type: integer}
        groups:
          type: array
          description: Только группы, в которых есть хотя бы один сигнал.
          items: {$ref: '#/components/schemas/ClustersReportGroup'}
        veto_effect:
          type: object
          additionalProperties: false
          required: [includes, trades_removed, winners_removed, winners_net_pnl, losers_removed, losers_net_pnl, net_effect]
          properties:
            includes:
              type: array
              items: {$ref: '#/components/schemas/ClusterVerdict'}
            trades_removed: {type: integer, minimum: 0}
            winners_removed: {type: integer, minimum: 0}
            winners_net_pnl: {$ref: '#/components/schemas/Money'}
            losers_removed: {type: integer, minimum: 0}
            losers_net_pnl: {$ref: '#/components/schemas/Money'}
            net_effect:
              allOf: [{$ref: '#/components/schemas/Money'}]
              description: Плюс — запрет улучшил бы результат.
        signals:
          type: array
          description: Все сигналы периода по возрастанию bar_close.
          items: {$ref: '#/components/schemas/ClustersReportSignal'}
        _links:
          type: object
          additionalProperties: false
          required: [self]
          properties:
            self: {$ref: '#/components/schemas/HalLink'}
            previous:
              allOf: [{$ref: '#/components/schemas/HalLink'}]
              description: Предыдущий период той же длины.
            next:
              allOf: [{$ref: '#/components/schemas/HalLink'}]
              description: Следующий период той же длины; нет, если он целиком в будущем.
security:
  - ExportToken: []
