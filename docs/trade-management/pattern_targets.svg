<text x="755" y="105" fill="#2563eb">━ Цена / форма</text><text x="755" y="133" fill="#dc2626">━ Активный стоп</text><text x="755" y="161" fill="#15803d">┄ Цели</text><text x="55" y="420">AB=10 · D=C+AB=114 · TP1=(106+114)/2=110 · S=106 после TP1</text><text x="55" y="445">До подтверждения C нет торгового плана; вход не переносится задним числом в точку C.</text>
