                      - {open_time: '2026-10-30T10:45:00Z', open: '3.409', high: '3.420', low: '3.404', close: '3.412', volume: 1312, complete: true}
                      - {open_time: '2026-10-30T11:00:00Z', open: '3.412', high: '3.416', low: '3.407', close: '3.410', volume: 455, complete: false}
                    _links:
                      self: {href: '/api/v1/candles/NG-12.26/15m?limit=3'}
                      series: {href: '/api/v1/candles?instrument=NG-12.26'}
                      earlier: {href: '/api/v1/candles/NG-12.26/15m?to=2026-10-30T10:30:00Z&limit=3'}
                beginning:
                  summary: Начало ряда — ссылки earlier нет
                  value:
                    instrument: NG-12.26
                    instrument_type: future
                    timeframe: 15m
                    from: null
                    to: '2026-09-15T07:15:00Z'
                    candles:
                      - {open_time: '2026-09-15T06:45:00Z', open: '3.050', high: '3.061', low: '3.044', close: '3.058', volume: 210, complete: true}
                      - {open_time: '2026-09-15T07:00:00Z', open: '3.058', high: '3.066', low: '3.051', close: '3.063', volume: 380, complete: true}
                    _links:
