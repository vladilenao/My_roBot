  /api/v1/candles/{instrument}/{timeframe}:
    parameters:
      - $ref: '#/components/parameters/CandleInstrument'
      - $ref: '#/components/parameters/Timeframe'
    get:
      tags: [Свечи]
      summary: Свечи ряда за окно
      description: |
        Свечи, время открытия которых попадает в окно `[from, to)`:
        **последние** `limit` свечей окна — ближайшие к `to` — по
        возрастанию времени. Без параметров — последние 500 свечей до
        текущего момента.

        * `complete: false` — незавершённая текущая свеча. Бывает только
          последней и только если она открыта позже последней завершённой;
          брошенные предварительные свечи внутри ряда не отдаются.
        * `_links.earlier` — предыдущее окно того же ряда: `to` равен
          открытию первой отданной свечи, `limit` тот же. Нет ссылки —
          раньше свечей нет. Так листание не зависит от сессий и выходных.
        * Обновление графика — опрос с `from`, равным открытию последней
          показанной свечи: придут она (возможно, уже завершённая) и новые.

        Пропуски — сессия закрыта, выходные, сделок не было — видны как
        отсутствие свечей. Цены — десятичные строки, `volume` — лоты.
        Только чтение: без запросов к брокеру и без записи в базу.
      operationId: getCandles
      security:
        - ControlToken: []
      parameters:
        - $ref: '#/components/parameters/CandleFrom'
        - $ref: '#/components/parameters/CandleTo'
        - $ref: '#/components/parameters/CandleLimit'
      responses:
        '200':
          description: Свечи окна.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CandlePage'}
              examples:
                latest:
                  summary: Последние свечи, текущая ещё не завершена
                  value:
                    instrument: NG-12.26
                    instrument_type: future
                    timeframe: 15m
                    from: null
                    to: '2026-10-30T11:14:05Z'
                    candles:
