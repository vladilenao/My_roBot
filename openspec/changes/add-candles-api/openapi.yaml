openapi: 3.0.3
info:
  title: My Robot — локальный API
  version: 2.3.0
  description: |
    Локальный API робота: управление контурами, состояние ядра, экспорт
    рыночных данных и отчёт кластеров. Swagger UI — `/docs`. Обзор
    контрактов — `docs/api/README.md`, решения и таблица «было → станет» —
    `docs/api/v2-decisions.md`.

    Главное отличие от 1.8: вместо общей оболочки `/api/v1/contours` у
    каждого контура свой ресурс со своей схемой и своим жизненным циклом.
    Маршруты `/api/v1/contours…` удалены без периода `deprecated` и
    отвечают `404 NOT_FOUND`.

    * `/api/v1/emulation` — эмуляция: один контур, живёт долго, состав
      меняется на ходу.
    * `/api/v1/history` — прогоны истории: много, очередь, каждый
      выполняется до конца.
    * `/api/v1/sandbox` — контур на брокере в песочнице Т-Инвест (2.1.0):
      один, состав из привязок, на этапе С2 только читает счёт и сверяет его.
    * `/api/v1/candles` — свечи рядов, которые хранит ядро (2.3.0): только
      чтение, для графиков UI.

    Общие части (целевое и текущее состояние, процесс, участник
    состава, ошибки) — общие схемы. Будущий контур «Счёт» встанет рядом на
    них же.

    **Ответы.** `application/json` со строгими схемами. В ответе:
    * `_links` — куда можно перейти (`self`, `log`, `instruments`, …);
    * `_actions` — что можно сделать **сейчас**: метод, адрес и готовое
      тело. UI рисует кнопки по `_actions`, а не по своей таблице
      состояний; сервер всё равно перепроверяет каждую команду.

    **Ошибки.** `application/problem+json` (RFC 9457) с полем `code` — те же
    коды, что в 1.8 (`CORE_NOT_READY`, `INSTRUMENTS_REJECTED`, …).

    **Рыночные данные и отчёт кластеров не меняются.** Маршруты под
    `ExportToken` перенесены из 1.8 как есть — с `producer_id`/`after_id`,
    ошибками `{code, message}` и прежними схемами. Их читает Historical
    Broker API Emulator, а экспорт уже вышел в релизе; переделка курсора —
    отдельное изменение вместе с эмулятором, если понадобится.

    **Целевое и текущее состояние.** Команда эмуляции и боевого контура не
    выполняется в момент ответа: она меняет целевое состояние (`target`) и получает
    новый номер ревизии (`revision`). Контур — отдельный процесс — применяет
    целевое состояние на ближайшей границе тика и сообщает в `current.applied_revision`,
    до какой ревизии дошёл. Команда выполнена, когда
    `current.applied_revision` догнал `target.revision`. Пример:

    | Что сделали | `target.revision` | `current.applied_revision` |
    |---|---|---|
    | запуск NG и SBER | 1 | — (процесс стартует) |
    | | 1 | 1 — торгует |
    | добавить BR | 2 | 1 — про BR ещё не знает |
    | | 2 | 2 — BR в составе |
    | `mode: no_entries` | 3 | 2 — торгует как раньше |
    | | 3 | 3 — новых входов нет |

    Ревизия отдаётся как `ETag`; `If-Match` защищает от двух команд
    одновременно. Внутри робота это `desired`/`actual`/`generation` в
    `core.sqlite3` и `status.json`.

    **Ключи.** `ControlToken` (`ROBOT_CONTROL_TOKEN`) — контуры, ядро и свечи.
    `ExportToken` (`MARKET_DATA_EXPORT_TOKEN`) — рыночные
    данные и отчёт кластеров. Только заголовок `Authorization: Bearer`.
servers:
  - url: /
    description: Робот; по умолчанию слушает только loopback.
tags:
  - name: Навигация
    description: Точка входа — состояние робота и ссылки на разделы.
  - name: Ядро
    description: Приём рыночных данных, пульс, запросы к брокеру.
  - name: Эмуляция
    description: Контур эмуляции — один, живёт долго, состав меняется на ходу.
  - name: История
    description: Прогоны истории — очередь, выполнение до конца, отчёт.
  - name: Песочница
    description: Контур на брокере в песочнице Т-Инвест — один, состав из привязок, сверка счёта.
  - name: Свечи
    description: Свечи рядов рыночной базы ядра для графиков UI — только чтение.
  - name: Рыночные данные
    description: Лента изменений для Historical Broker API Emulator. Как в 1.8, без изменений.
  - name: Кластеры
    description: Отчёт кластерного фильтра входа. Как в 1.8, без изменений.
  - name: Служебное
    description: Сам контракт и Swagger UI.

paths:
  # ---------------------------------------------------------------- навигация
  /api/v1:
    get:
      tags: [Навигация]
      summary: Точка входа
      description: |
        Короткая сводка робота и ссылки на разделы. Набор ссылок зависит от
        ключа: `ControlToken` видит ядро и контуры, `ExportToken` —
        рыночные данные и отчёт кластеров. Заменяет общий список
        `GET /api/v1/contours` как место, где «всё видно одним запросом».
        С ключом управления действует и проверка `Host`.
      operationId: getHome
      security:
        - ControlToken: []
        - ExportToken: []
      responses:
        '200':
          description: Сводка и ссылки.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Home'}
              examples:
                control:
                  summary: Ключ управления
                  value:
                    version: 7.2.0
                    core: {state: ready}
                    emulation: {state: running, instruments: 2, open_positions: 1}
                    history: {running: 1, queued: 0, max: 2}
                    live: null
                    _links:
                      self: {href: /api/v1}
                      core: {href: /api/v1/core}
                      emulation: {href: /api/v1/emulation}
                      history: {href: /api/v1/history}
                      candles: {href: /api/v1/candles}
                      docs: {href: /docs}
                export:
                  summary: Ключ экспорта
                  value:
                    version: 7.2.0
                    core: {state: ready}
                    emulation: null
                    history: null
                    live: null
                    _links:
                      self: {href: /api/v1}
                      market-data: {href: /api/v1/market-data/source}
                      clusters-report: {href: /api/v1/clusters/report}
                      docs: {href: /docs}
        '401': {$ref: '#/components/responses/Unauthorized'}

  # -------------------------------------------------------------------- ядро
  /api/v1/core:
    get:
      tags: [Ядро]
      summary: Состояние ядра
      description: |
        Как в 1.8: старт ядра (`starting`, `ready`, `retrying`, `failed`),
        пульс, готовность живых пар, запросы к брокеру за минуту. Отвечает
        при любом состоянии ядра — API поднимается раньше него.
      operationId: getCore
      security:
        - ControlToken: []
      responses:
        '200':
          description: Состояние ядра.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Core'}
              example:
                state: retrying
                error: 'ConnectError: брокер недоступен'
                attempts: 2
                next_retry_at: '2026-10-24T09:02:30Z'
                version: 7.2.0
                pid: 4242
                started_at: '2026-10-24T09:00:00Z'
                heartbeat: {beat_at: '2026-10-24T09:01:35Z', interval_secs: 5}
                market_data: null
                quotas: {}
                _links:
                  self: {href: /api/v1/core}
                  home: {href: /api/v1}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}
        '404': {$ref: '#/components/responses/NotFound'}

  # --------------------------------------------------------------- эмуляция
  /api/v1/emulation:
    get:
      tags: [Эмуляция]
      summary: Контур эмуляции
      description: |
        Один объект: общее, целевое и текущее состояние, процесс,
        состав и действия, доступные сейчас. Заголовок `ETag` — ревизия
        целевого состояния; его можно передать в `If-Match` команды.
      operationId: getEmulation
      security:
        - ControlToken: []
      responses:
        '200':
          description: Контур эмуляции.
          headers:
            ETag: {$ref: '#/components/headers/RevisionETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Emulation'}
              examples:
                waiting:
                  summary: Робот ждёт команду, ядро готово
                  value:
                    state: waiting_command
                    target: null
                    current: null
                    launch: null
                    process: null
                    instruments: []
                    _links:
                      self: {href: /api/v1/emulation}
                      target: {href: /api/v1/emulation/target}
                      instruments: {href: /api/v1/emulation/instruments}
                      log: {href: /api/v1/emulation/log}
                    _actions:
                      - name: start
                        title: Запустить эмуляцию
                        method: PUT
                        href: /api/v1/emulation/target
                        body: {mode: 'on'}
                running:
                  summary: Торгует
                  value:
                    state: running
                    target: {mode: 'on', revision: 3}
                    current:
                      state: running
                      applied_revision: 3
                      open_positions: 1
                      pending_entries: 0
                      last_tick_at: '2026-10-24T11:02:00Z'
                      core_link: ok
                    launch:
                      source: api
                      recovery: null
                      started_at: '2026-10-24T10:15:00Z'
                      request: {mode: 'on', instruments: [NG-12.26, SBER]}
                      rejections: []
                    process: {pid: 81412, exit_code: null, exited_at: null, dir: contours/emulation}
                    instruments:
                      - name: NG-12.26
                        instrument_type: future
                        days_to_expiry: 52
                        target: active
                        remove_mode: null
                        current: trading
                        _links:
                          self: {href: /api/v1/emulation/instruments/NG-12.26}
                        _actions:
                          - {name: remove, title: 'Убрать, сделки доживают', method: POST, href: /api/v1/emulation/instruments/remove, body: {instruments: [NG-12.26], mode: no_entries}}
                          - {name: remove-close-all, title: 'Убрать и закрыть позиции', method: POST, href: /api/v1/emulation/instruments/remove, body: {instruments: [NG-12.26], mode: close_all}}
                    _links:
                      self: {href: /api/v1/emulation}
                      target: {href: /api/v1/emulation/target}
                      instruments: {href: /api/v1/emulation/instruments}
                      log: {href: /api/v1/emulation/log}
                    _actions:
                      - {name: stop, title: 'Остановить, сделки доживают', method: PUT, href: /api/v1/emulation/target, body: {mode: no_entries}}
                      - {name: stop-close-all, title: 'Остановить и закрыть всё', method: PUT, href: /api/v1/emulation/target, body: {mode: close_all}}
                      - {name: add-instruments, title: 'Добавить инструменты', method: POST, href: /api/v1/emulation/instruments, body: {instruments: []}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}

  /api/v1/emulation/target:
    get:
      tags: [Эмуляция]
      summary: Целевое состояние эмуляции
      operationId: getEmulationTarget
      security:
        - ControlToken: []
      responses:
        '200':
          description: Целевое состояние (в `core.sqlite3` — `desired`).
          headers:
            ETag: {$ref: '#/components/headers/RevisionETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TradingTarget'}
              example: {mode: 'on', revision: 3}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}
        '404':
          description: Эмуляцию ни разу не запускали — целевого состояния нет (`NOT_FOUND`).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
    put:
      tags: [Эмуляция]
      summary: Запустить или остановить эмуляцию
      description: |
        Одна команда на все режимы торговли: она задаёт целевое состояние эмуляции.

        **Торговать** `{"mode": "on", "instruments": [...]}`. Работает, когда
        эмуляция ждёт команду, остановлена или упала, и ядро готово.
        `instruments` — тикеры акций (`SBER`) и короткие имена контрактов
        (`NG-12.26`), те же имена, что в составе и в удалении. Код семейства
        (`NG`) и биржевой тикер (`NGZ6`) не принимаются: отказ подскажет
        короткое имя ближайшего допустимого контракта. Без поля или `all` — все инструменты с привязками, у
        семейств — ближайший контракт за порогом `contract_expiry_block_days`.
        Отказ строгий: хотя бы один инструмент отклонён — запуска нет (`422`). Если
        проверка у брокера не уложилась в 60 секунд — `202`, итог в
        `launch.rejections`.

        **Без новых входов** `{"mode": "no_entries"}` — неисполненные входы
        снимаются, позиции доживают; после последней процесс завершается.
        **Закрыть всё** `{"mode": "close_all"}` — позиции закрываются на
        открытии следующего бара, затем процесс завершается. `close_all` поверх
        `no_entries` принимается, обратно — `409 MODE_CONFLICT`.

        Повтор той же остановки — `200`, ревизия прежняя. `on`, когда
        эмуляция уже запускается или торгует, — `409 ALREADY_RUNNING`:
        состав меняется через `/api/v1/emulation/instruments`.
      operationId: putEmulationTarget
      security:
        - ControlToken: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmulationTargetRequest'}
            examples:
              start:
                summary: Запустить газ и Сбер
                value: {mode: 'on', instruments: [NG-12.26, SBER]}
              startAll:
                summary: Запустить всё с привязками
                value: {mode: 'on'}
              stop:
                summary: Остановить, сделки доживают
                value: {mode: no_entries}
              stopCloseAll:
                summary: Остановить и закрыть всё
                value: {mode: close_all}
      responses:
        '202':
          description: Целевое состояние записано новой ревизией; следить — `GET /api/v1/emulation`.
          headers:
            Location: {$ref: '#/components/headers/EmulationLocation'}
            ETag: {$ref: '#/components/headers/RevisionETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Emulation'}
        '200':
          description: Повтор той же остановки; ревизия прежняя.
          headers:
            ETag: {$ref: '#/components/headers/RevisionETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Emulation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}
        '409':
          description: |
            `ALREADY_RUNNING`, `STOPPING`, `NOT_RUNNING` (остановка, когда
            процесса нет), `MODE_CONFLICT`, `CORE_NOT_READY` (в `core` —
            состояние ядра), `CONTOUR_DIR_BUSY` (в `pid` — чужой процесс).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example:
                type: 'urn:my-robot:problem:core-not-ready'
                title: Ядро не готово
                status: 409
                code: CORE_NOT_READY
                detail: Ядро повторяет старт; следующая попытка в 09:02:30 UTC.
                core: {state: retrying, attempts: 2, next_retry_at: '2026-10-24T09:02:30Z'}
        '412': {$ref: '#/components/responses/RevisionChanged'}
        '422': {$ref: '#/components/responses/InstrumentsRejected'}

  /api/v1/emulation/instruments:
    get:
      tags: [Эмуляция]
      summary: Состав эмуляции
      description: Все инструменты целевого состава, включая убираемые, с текущим состоянием.
      operationId: listEmulationInstruments
      security:
        - ControlToken: []
      responses:
        '200':
          description: Состав.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}
    post:
      tags: [Эмуляция]
      summary: Добавить инструменты на ходу
      description: |
        Тикеры акций и короткие имена контрактов — те же имена, которыми
        инструменты потом видны в составе и убираются. Код семейства не
        принимается (`422` с подсказкой ближайшего контракта). Отказ строгий:
        хотя бы один инструмент отклонён — состав не меняется (`422`). Новый инструмент прогревается
        (`warming`), проходит стартовый обзор и торгует. Добавление
        убираемого инструмента возвращает его в торговлю. Повтор — `200`.
      operationId: addEmulationInstruments
      security:
        - ControlToken: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstrumentsAddRequest'}
            example: {instruments: [NG-12.26, SBER]}
      responses:
        '202':
          description: Изменение записано новой ревизией.
          headers:
            ETag: {$ref: '#/components/headers/RevisionETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberList'}
        '200':
          description: Повтор — состав уже такой.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}
        '409':
          description: '`NOT_RUNNING` — процесса эмуляции нет; `STOPPING` — эмуляция останавливается.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '412': {$ref: '#/components/responses/RevisionChanged'}
        '422': {$ref: '#/components/responses/InstrumentsRejected'}

  /api/v1/emulation/instruments/remove:
    post:
      tags: [Эмуляция]
      summary: Убрать инструменты из состава
      description: |
        Пакетная команда (паттерн batch delete): тело — список инструментов и
        режим. `DELETE` с телом не используется: у тела `DELETE` в HTTP нет
        определённого смысла, часть клиентов его отбрасывает.

        * `no_entries` (по умолчанию) — новых входов нет, неисполненные входы
          снимаются, позиции доживают;
        * `close_all` — позиции закрываются на открытии следующего бара.

        Без сделок инструмент выходит из состава. Отказ строгий: если хотя
        бы одного инструмента нет в составе — ничего не меняется (`422`).
        Повтор — `200`; `no_entries` поверх `close_all` — `409 MODE_CONFLICT`.
      operationId: removeEmulationInstruments
      security:
        - ControlToken: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstrumentsRemoveRequest'}
            examples:
              drain:
                summary: Убрать газ и Сбер, сделки доживают
                value: {instruments: [NG-12.26, SBER]}
              closeAll:
                summary: Убрать газ и закрыть его позиции
                value: {instruments: [NG-12.26], mode: close_all}
      responses:
        '202':
          description: Удаление записано новой ревизией; участники в состоянии `draining` или `closing`.
          headers:
            ETag: {$ref: '#/components/headers/RevisionETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberList'}
        '200':
          description: Повтор — удаление уже записано.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}
        '409':
          description: '`NOT_RUNNING`, `STOPPING`, `MODE_CONFLICT`.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '412': {$ref: '#/components/responses/RevisionChanged'}
        '422':
          description: Хотя бы одного инструмента нет в составе; ничего не изменено (`INSTRUMENTS_REJECTED`).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
              example:
                type: 'urn:my-robot:problem:instruments-rejected'
                title: Инструменты отклонены
                status: 422
                code: INSTRUMENTS_REJECTED
                detail: Состав не изменён.
                rejections:
                  - {instrument: GAZP, reason: Инструмента нет в составе эмуляции.}

  /api/v1/emulation/instruments/{name}:
    parameters:
      - $ref: '#/components/parameters/MemberName'
    get:
      tags: [Эмуляция]
      summary: Один участник состава
      operationId: getEmulationInstrument
      security:
        - ControlToken: []
      responses:
        '200':
          description: Участник состава.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/emulation/log:
    get:
      tags: [Эмуляция]
      summary: Последние строки журнала эмуляции
      operationId: getEmulationLog
      security:
        - ControlToken: []
      parameters:
        - $ref: '#/components/parameters/Tail'
      responses:
        '200': {$ref: '#/components/responses/LogTail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}

  # -------------------------------------------------------------- песочница
  /api/v1/sandbox:
    get:
      tags: [Песочница]
      summary: Контур «Песочница»
      description: |
        Контур на брокере в песочнице Т-Инвест: общее, целевое и текущее
        состояние, запуск, процесс, состав из привязок и действия, доступные
        сейчас. На этапе С2 контур только читает счёт и сверяет его с журналом:
        заявок нет. `ETag` — ревизия целевого состояния.
      operationId: getSandbox
      security:
        - ControlToken: []
      responses:
        '200':
          description: Контур «Песочница».
          headers:
            ETag: {$ref: '#/components/headers/RevisionETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sandbox'}
              examples:
                alarm:
                  summary: Работает, на счёте ручная позиция
                  value:
                    state: running
                    target: {mode: 'on', revision: 2}
                    current:
                      state: running
                      applied_revision: 2
                      account: '…09c3'
                      capital: {rub: '976039.46', liquid_portfolio: '1023916.40'}
                      positions: [{name: NG-11.26, lots: 1}]
                      orders: 0
                      stop_orders: 0
                      frozen: [NG-11.26]
                      last_reconcile_at: '2026-10-30T09:15:00Z'
                      account_link: ok
                      core_link: ok
                      reason: null
                    launch:
                      source: api
                      recovery: null
                      started_at: '2026-10-30T09:10:02Z'
                      request: {mode: 'on', bindings: [future-ng-macd]}
                      rejections: []
                    process: {pid: 90211, exit_code: null, exited_at: null, dir: contours/sandbox}
                    bindings:
                      - id: future-ng-macd
                        instrument: NG
                        strategy: macd_rsi_stoch
                        timeframe: 15m
                        target: active
                        remove_mode: null
                        current: watching
                        _actions:
                          - {name: remove, title: Убрать из песочницы, method: POST, href: /api/v1/sandbox/bindings/remove, body: {bindings: [future-ng-macd], mode: no_entries}}
                    _links:
                      self: {href: /api/v1/sandbox}
                      target: {href: /api/v1/sandbox/target}
                      bindings: {href: /api/v1/sandbox/bindings}
                      reconcile: {href: /api/v1/sandbox/reconcile}
                      log: {href: /api/v1/sandbox/log}
                    _actions:
                      - {name: stop, title: Остановить, method: PUT, href: /api/v1/sandbox/target, body: {mode: no_entries}}
                      - {name: add-bindings, title: Добавить привязки, method: POST, href: /api/v1/sandbox/bindings, body: {bindings: []}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}

  /api/v1/sandbox/target:
    get:
      tags: [Песочница]
      summary: Целевое состояние песочницы
      operationId: getSandboxTarget
      security:
        - ControlToken: []
      responses:
        '200':
          description: Целевое состояние; `null` — контур ни разу не запускали.
          headers:
            ETag: {$ref: '#/components/headers/RevisionETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TradingTarget'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}
    put:
      tags: [Песочница]
      summary: Запустить или остановить песочницу
      description: |
        **Запустить** `{"mode": "on", "bindings": [...]}` — `bindings` это `id`
        привязок из `[strategies.*]`; без поля — с текущим составом (может
        быть пустым). Неизвестный `id` — `422 BINDINGS_REJECTED`, запуска нет.

        **Остановить** `{"mode": "no_entries"}` или `{"mode": "close_all"}`.
        На этапе С2 у контура нет своих сделок: оба режима завершают процесс на
        ближайшем шаге, а `close_all` ручные позиции на счёте не трогает.

        `confirm` не нужен: денег в песочнице нет.
      operationId: putSandboxTarget
      security:
        - ControlToken: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SandboxTargetRequest'}
            examples:
              start:
                summary: Запустить с одной привязкой газа
                value: {mode: 'on', bindings: [future-ng-macd]}
              stop:
                summary: Остановить
                value: {mode: no_entries}
      responses:
        '202':
          description: Целевое состояние записано новой ревизией; следить — `GET /api/v1/sandbox`.
          headers:
            Location: {$ref: '#/components/headers/SandboxLocation'}
            ETag: {$ref: '#/components/headers/RevisionETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sandbox'}
        '200':
          description: Повтор той же остановки; ревизия прежняя.
          headers:
            ETag: {$ref: '#/components/headers/RevisionETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Sandbox'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}
        '409':
          description: '`ALREADY_RUNNING`, `STOPPING`, `NOT_RUNNING`, `CORE_NOT_READY`, `CONTOUR_DIR_BUSY` — как у эмуляции.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '412': {$ref: '#/components/responses/RevisionChanged'}
        '422': {$ref: '#/components/responses/BindingsRejected'}

  /api/v1/sandbox/bindings:
    get:
      tags: [Песочница]
      summary: Состав песочницы и все привязки конфигурации
      description: |
        `members` — состав песочницы. `available` — все привязки
        `[strategies.*]` с `trades_in`: где каждая сейчас торгует
        (`emulation` — инструмент привязки в составе эмуляции, `sandbox` —
        привязка в составе песочницы). По этому списку выбирают, что
        переводить дальше.
      operationId: getSandboxBindings
      security:
        - ControlToken: []
      responses:
        '200':
          description: Состав и привязки.
          headers:
            ETag: {$ref: '#/components/headers/RevisionETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BindingsView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}
    post:
      tags: [Песочница]
      summary: Добавить привязки в песочницу
      description: |
        Принимается и тогда, когда процесс не запущен: меняет состав для
        следующего запуска. Уже в составе — `200` без новой ревизии.
      operationId: addSandboxBindings
      security:
        - ControlToken: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BindingsAddRequest'}
            example: {bindings: [future-ng-macd]}
      responses:
        '202':
          description: Состав изменён новой ревизией.
          headers:
            ETag: {$ref: '#/components/headers/RevisionETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BindingsView'}
        '200':
          description: Без изменений.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BindingsView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}
        '412': {$ref: '#/components/responses/RevisionChanged'}
        '422': {$ref: '#/components/responses/BindingsRejected'}

  /api/v1/sandbox/bindings/remove:
    post:
      tags: [Песочница]
      summary: Убрать привязки из песочницы
      operationId: removeSandboxBindings
      security:
        - ControlToken: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BindingsRemoveRequest'}
            example: {bindings: [future-ng-macd], mode: no_entries}
      responses:
        '202':
          description: Состав изменён новой ревизией.
          headers:
            ETag: {$ref: '#/components/headers/RevisionETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BindingsView'}
        '200':
          description: Без изменений — привязки уже сняты.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BindingsView'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}
        '412': {$ref: '#/components/responses/RevisionChanged'}
        '422': {$ref: '#/components/responses/BindingsRejected'}

  /api/v1/sandbox/reconcile:
    get:
      tags: [Песочница]
      summary: Последний отчёт сверщика
      description: |
        Сверка счёта песочницы с журналом контура: при старте и раз в
        `reconcile_every_min`. На этапе С2 журнал пуст, поэтому всё, что есть
        на счёте, — расхождение «на счёте есть, в журнале нет».
      operationId: getSandboxReconcile
      security:
        - ControlToken: []
      responses:
        '200':
          description: Отчёт; `null` — сверки ещё не было.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReconcileReport'}
              example:
                at: '2026-10-30T09:15:00Z'
                account: '…09c3'
                result: mismatch
                items: [{instrument: NG-11.26, what: position, account: 1, journal: 0}]
                frozen: [NG-11.26]
                skipped_in_row: 0
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}

  /api/v1/sandbox/log:
    get:
      tags: [Песочница]
      summary: Последние строки журнала песочницы
      operationId: getSandboxLog
      security:
        - ControlToken: []
      parameters:
        - $ref: '#/components/parameters/Tail'
      responses:
        '200': {$ref: '#/components/responses/LogTail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}

  # ---------------------------------------------------------------- история
  /api/v1/history:
    get:
      tags: [История]
      summary: Прогоны истории
      description: |
        Идущие и ждущие прогоны и `limit` последних завершённых, новые
        первыми. `limits` — сколько прогонов может идти сразу, сколько идёт и
        сколько ждёт.
      operationId: listHistoryRuns
      security:
        - ControlToken: []
      parameters:
        - name: state
          in: query
          required: false
          description: '`active` — только в очереди и в работе; `finished` — только завершённые.'
          schema: {type: string, enum: [active, finished]}
        - name: limit
          in: query
          required: false
          description: Сколько завершённых прогонов показать.
          schema: {type: integer, minimum: 1, maximum: 200, default: 20}
      responses:
        '200':
          description: Прогоны.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoryRunList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}
    post:
      tags: [История]
      summary: Поставить прогон в очередь
      description: |
        Принимается всегда — без эмуляции и до готовности ядра: свечи прогону
        даёт эмулятор данных. Одновременно идут не больше
        `[contours] max_history_runs`, остальные ждут (`queued`). До ответа
        проверяются форма и привязки. В истории, в отличие от эмуляции, код
        семейства (`NG`) принимается и означает другое — автоматическую
        цепочку контрактов на весь диапазон; контракт (`NG-12.26`) —
        фиксированный; семейство вместе со своим контрактом — конфликт. Контракты у эмулятора и покрытие свечей
        проверяет процесс прогона; отказ виден как `failed` с причиной.
        Инструмент, названный и в истории, и в эмуляции, торгуется по одним
        привязкам `robot.toml`.
      operationId: createHistoryRun
      security:
        - ControlToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HistoryRunRequest'}
            example: {from: '2026-06-01 00:00', to: '2026-06-05 00:00', pause: 0, instruments: [BR]}
      responses:
        '202':
          description: Прогон в очереди; `Location` — его адрес.
          headers:
            Location:
              schema: {type: string, example: /api/v1/history/20261024-101500}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoryRun'}
              example:
                id: '20261024-101500'
                state: queued
                request: {from: '2026-06-01 00:00', to: '2026-06-05 00:00', pause: 0, instruments: [BR]}
                accepted_at: '2026-10-24T10:15:00Z'
                started_at: null
                finished_at: null
                queue_position: 1
                reason: null
                market_data_sync: null
                progress: null
                process: null
                _links:
                  self: {href: /api/v1/history/20261024-101500}
                  log: {href: /api/v1/history/20261024-101500/log}
                _actions:
                  - {name: cancel, title: 'Убрать из очереди', method: POST, href: /api/v1/history/20261024-101500/stop}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}
        '422': {$ref: '#/components/responses/InstrumentsRejected'}

  /api/v1/history/{run_id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [История]
      summary: Один прогон
      operationId: getHistoryRun
      security:
        - ControlToken: []
      responses:
        '200':
          description: Прогон.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoryRun'}
              example:
                id: '20261024-101500'
                state: running
                request: {from: '2026-09-01 10:00', to: '2026-09-08 10:00', pause: 0, instruments: [NG]}
                accepted_at: '2026-10-24T10:15:00Z'
                started_at: '2026-10-24T10:15:02Z'
                finished_at: null
                queue_position: null
                reason: null
                market_data_sync: {status: synchronized, snapshot_generation: 41}
                progress:
                  phase: running
                  start: '2026-09-01T10:00:00Z'
                  end: '2026-09-08T10:00:00Z'
                  market_now: '2026-09-04T12:00:00Z'
                  ticks: 4440
                  fraction: 0.4405
                process: {pid: 90311, exit_code: null, exited_at: null, dir: contours/history/20261024-101500}
                _links:
                  self: {href: /api/v1/history/20261024-101500}
                  log: {href: /api/v1/history/20261024-101500/log}
                  collection: {href: /api/v1/history}
                _actions:
                  - {name: stop, title: 'Остановить с отчётом', method: POST, href: /api/v1/history/20261024-101500/stop}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/history/{run_id}/stop:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [История]
      summary: Остановить или убрать из очереди
      description: |
        Прогон — задание, которое идёт до конца, а не целевое состояние торговли,
        поэтому здесь команда (паттерн «отмена долгой операции»), а не
        `PUT target`. Тела нет. Ждущий прогон убирается (`cancelled`),
        идущий останавливается после тика и пишет отчёт «остановлено
        оператором» (`stopping` → `stopped`). Повтор — `200`.
      operationId: stopHistoryRun
      security:
        - ControlToken: []
      responses:
        '202':
          description: Остановка принята; прогон в `stopping` или уже `cancelled`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoryRun'}
        '200':
          description: Повтор — остановка уже запрошена.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoryRun'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`NOT_RUNNING` — прогон уже завершён.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

  /api/v1/history/{run_id}/report:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [История]
      summary: Итог прогона
      description: |
        Сводка из `report.json`. Вынесена из прогона: она есть только у
        завершённого, а у идущего вместо неё `progress`.
      operationId: getHistoryRunReport
      security:
        - ControlToken: []
      responses:
        '200':
          description: Итог.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoryReport'}
              example:
                covered: true
                stop_reason: диапазон [2026-09-01 10:00 — 2026-09-08 10:00) обработан полностью
                trades: 7
                net_pnl: {amount: '1234.50', currency: RUB}
                fees: {amount: '56.00', currency: RUB}
                balance: {amount: '101234.50', currency: RUB}
                open_positions: []
                _links:
                  run: {href: /api/v1/history/20261024-101500}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}
        '404':
          description: '`NOT_FOUND` — прогона нет; `REPORT_NOT_READY` — прогон ещё не завершён или отчёт не записан.'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

  /api/v1/history/{run_id}/log:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [История]
      summary: Последние строки журнала прогона
      operationId: getHistoryRunLog
      security:
        - ControlToken: []
      parameters:
        - $ref: '#/components/parameters/Tail'
      responses:
        '200': {$ref: '#/components/responses/LogTail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/ForbiddenHost'}
        '404': {$ref: '#/components/responses/NotFound'}

  # ------------------------------------------------------------------ свечи
  /api/v1/candles:
    get:
      tags: [Свечи]
      summary: Ряды свечей
      description: |
        Ряды, которые хранит рыночная база ядра: пара «инструмент ×
        таймфрейм» из состава базы, включая пары, которые больше не нужны
        (`status: retired`, их свечи остаются). По этому списку UI строит
        выбор инструмента и таймфрейма графика.

        Таймфреймы — только родные таймфреймы брокера, которые ядро получает
        для привязок стратегий и исполнения по `1m`. Ресурс не собирает один
        таймфрейм из другого: брокер строит `4h` и `1d` только из биржевых
        сделок, и собранная из `1m` свеча разошлась бы с той, что видела
        стратегия.

        Только чтение: без запросов к брокеру и без записи в базу. Биржевой
        тикер и `instrument_uid` в ответе не появляются.
      operationId: listCandleSeries
      security:
        - ControlToken: []
      parameters:
        - name: instrument
          in: query
          required: false
          description: |
            Оставить ряды одного инструмента: короткое имя контракта или тикер
            акции, без учёта регистра. Неизвестное имя — пустой список.
          schema: {type: string, minLength: 1, example: NG-12.26}
      responses:
        '200':
          description: Ряды свечей — по инструменту, затем по длительности таймфрейма.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CandleSeriesList'}
              example:
                items:
                  - instrument: NG-11.26
                    instrument_type: future
                    timeframe: 15m
                    status: retired
                    first_open_time: '2026-08-14T06:45:00Z'
                    last_open_time: '2026-10-27T20:30:00Z'
                    last_close: '3.187'
                    readiness: null
                    _links:
