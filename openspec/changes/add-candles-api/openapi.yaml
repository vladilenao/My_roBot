        '200':
          description: Интерактивная документация.
          content:
            text/html:
              schema: {type: string}

components:
  securitySchemes:
    ControlToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: '`ROBOT_CONTROL_TOKEN` — контуры и ядро.'
    ExportToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: '`MARKET_DATA_EXPORT_TOKEN` — рыночные данные и отчёт кластеров.'

  headers:
    RevisionETag:
      description: Ревизия целевого состояния в кавычках, например `"3"`.
      schema: {type: string, example: '"3"'}
    EmulationLocation:
      description: Адрес контура эмуляции.
      schema: {type: string, example: /api/v1/emulation}
    SandboxLocation:
      description: Адрес контура «Песочница».
      schema: {type: string, example: /api/v1/sandbox}

  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        `ETag` из последнего ответа. Если целевое состояние за это
        время сменило ревизию, команда отклоняется `412 REVISION_CHANGED`. Без
        заголовка команда применяется к текущему целевому состоянию.
      schema: {type: string, example: '"3"'}
    MemberName:
      name: name
      in: path
      required: true
      description: Тикер акции (`SBER`) или короткое имя контракта (`NG-12.26`).
      schema: {type: string, minLength: 1}
    RunId:
      name: run_id
      in: path
      required: true
      description: |
        Время приёма прогона `ГГГГММДД-ЧЧММСС[-N]`, совпадает с именем его
        папки `data/contours/history/<run_id>/`. Префикс `history-` из 1.8
        не нужен: вид контура уже задан адресом.
      schema: {type: string, pattern: '^[0-9]{8}-[0-9]{6}(-[0-9]+)?$', example: '20261024-101500'}
    Tail:
      name: tail
      in: query
      required: false
      description: Сколько последних строк вернуть.
      schema: {type: integer, minimum: 1, maximum: 1000, default: 200}
    CandleInstrument:
      name: instrument
      in: path
      required: true
      description: |
        Короткое имя контракта (`NG-12.26`) или тикер акции (`SBER`) — те же
        имена, что в командах контуров; без учёта регистра. Биржевой тикер
        (`NGZ6`) и код семейства (`NG`) не принимаются: `404` с подсказкой в
        `suggestions`.
      schema: {type: string, minLength: 1, example: NG-12.26}
    Timeframe:
      name: timeframe
      in: path
      required: true
      description: |
        Родной таймфрейм брокера. Значение не из списка — `400`; таймфрейма
        нет у инструмента в составе базы — `404` с имеющимися в `suggestions`.
      schema: {$ref: '#/components/schemas/Timeframe'}
    CandleFrom:
      name: from
      in: query
      required: false
      description: Начало окна — момент ISO 8601 с зоной, входит в окно. По умолчанию не ограничено.
      schema: {type: string, format: date-time, example: '2026-10-30T06:00:00Z'}
    CandleTo:
      name: to
      in: query
      required: false
      description: Конец окна — момент ISO 8601 с зоной, в окно не входит. По умолчанию — текущий момент.
      schema: {type: string, format: date-time, example: '2026-10-30T20:00:00Z'}
    CandleLimit:
      name: limit
      in: query
      required: false
      description: Сколько последних свечей окна отдать.
      schema: {type: integer, minimum: 1, maximum: 5000, default: 500}
  responses:
    BadRequest:
      description: Неверное тело или параметр (`INVALID_REQUEST`).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: 'urn:my-robot:problem:invalid-request'
            title: Неверный запрос
            status: 400
            code: INVALID_REQUEST
            detail: Начало диапазона (2026-09-08 10:00) должно быть раньше конца (2026-09-01 10:00).
    Unauthorized:
      description: Ключ отсутствует или не подходит (`UNAUTHORIZED`).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ForbiddenHost:
      description: '`Host` не loopback-адрес сервера (`FORBIDDEN_HOST`).'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Ресурса нет (`NOT_FOUND`).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    RevisionChanged:
      description: '`If-Match` не совпал с текущей ревизией (`REVISION_CHANGED`); перечитайте контур.'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: 'urn:my-robot:problem:revision-changed'
            title: Целевое состояние уже изменилось
            status: 412
            code: REVISION_CHANGED
            detail: 'Ожидалась ревизия 3, текущая 4.'
    InstrumentsRejected:
      description: Хотя бы один инструмент отклонён; ничего не изменено (`INSTRUMENTS_REJECTED`).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: 'urn:my-robot:problem:instruments-rejected'
            title: Инструменты отклонены
            status: 422
            code: INSTRUMENTS_REJECTED
            detail: Торговля не запущена.
            rejections:
              - {instrument: AFLT, reason: У инструмента нет привязок в robot.toml.}
              - {instrument: NG, reason: 'Код семейства не принимается — укажите контракт; ближайший допустимый — NG-12.26.'}
    BindingsRejected:
      description: Хотя бы одна привязка отклонена; ничего не изменено (`BINDINGS_REJECTED`).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: 'urn:my-robot:problem:bindings-rejected'
            title: Привязки отклонены
            status: 422
            code: BINDINGS_REJECTED
            detail: Состав не изменён.
            rejections:
              - {binding: share-xxx, reason: Привязки нет в конфигурации.}
    ExportDisabled:
      description: 'Экспорт выключен: `[market_data] export_enabled = false`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
          example: {code: EXPORT_DISABLED, message: 'Экспорт выключен: [market_data] export_enabled = false.'}
    ExportBadRequest:
      description: Неверный параметр или идентификатор вне допустимого диапазона.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ExportUnauthorized:
      description: Токен отсутствует или неверен.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ProducerMismatch:
      description: Курсор относится к другой локальной БД My Robot.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: PRODUCER_MISMATCH
            message: Запрошенный producer_id не совпадает с текущим.
    CursorExpired:
      description: Курсор старше сохранённого диапазона; требуется сверка.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: CURSOR_EXPIRED
            message: Часть журнала изменений недоступна; выполните сверку.
    Unavailable:
      description: |
        Локальное рыночное хранилище временно недоступно или ядро ещё не
        открыло его (`MARKET_DATA_NOT_READY`: робот запущен, ядро стартует
        или повторяет старт — см. `GET /api/v1/core`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    MarketDataNotReady:
      description: |
        Ядро ещё не открыло рыночную базу (`MARKET_DATA_NOT_READY`): робот
        запущен, ядро стартует — см. `GET /api/v1/core`.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          example:
            type: 'urn:my-robot:problem:market-data-not-ready'
            title: Рыночная база не готова
            status: 503
            code: MARKET_DATA_NOT_READY
            detail: Ядро ещё не открыло рыночную базу; состояние — GET /api/v1/core.
    CandlesNotFound:
      description: |
        Ряда нет (`NOT_FOUND`): имя инструмента не разрешилось или у
        инструмента нет такого таймфрейма. `suggestions` — подходящие
        короткие имена или имеющиеся таймфреймы, возможно пустой список.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            family:
              summary: Код семейства
              value:
                type: 'urn:my-robot:problem:not-found'
                title: Ряд свечей не найден
                status: 404
                code: NOT_FOUND
                detail: Код семейства не принимается — укажите контракт.
                suggestions: [NG-12.26, NG-11.26]
            exchangeTicker:
              summary: Биржевой тикер контракта
              value:
                type: 'urn:my-robot:problem:not-found'
                title: Ряд свечей не найден
                status: 404
                code: NOT_FOUND
                detail: Укажите короткое имя контракта.
                suggestions: [NG-12.26]
            timeframe:
              summary: У инструмента нет такого таймфрейма
              value:
                type: 'urn:my-robot:problem:not-found'
                title: Ряд свечей не найден
                status: 404
                code: NOT_FOUND
                detail: У NG-12.26 нет ряда 4h.
                suggestions: [1m, 15m]
            unknown:
              summary: Неизвестное имя
              value:
                type: 'urn:my-robot:problem:not-found'
                title: Ряд свечей не найден
                status: 404
                code: NOT_FOUND
                detail: Инструмента AAAA нет в рыночной базе.
                suggestions: []
    LogTail:
      description: Последние строки журнала; секреты уже заменены на `[скрыто]`. Нет журнала — пустой ответ.
      content:
        text/plain:
          schema: {type: string}

  schemas:
    # ------------------------------------------------------ гипермедиа и ошибки
    Link:
      type: object
      additionalProperties: false
      required: [href]
      properties:
        href: {type: string, description: Относительный адрес.}
        title: {type: string}
    Links:
      type: object
      description: Ссылки по имени связи (`self`, `log`, `instruments`, …).
      additionalProperties: {$ref: '#/components/schemas/Link'}
    Action:
      type: object
      additionalProperties: false
      required: [name, method, href]
      description: Действие, доступное сейчас. UI показывает кнопку только для действий из ответа.
      properties:
        name: {type: string, example: stop}
        title: {type: string, example: 'Остановить, сделки доживают'}
        method: {type: string, enum: [GET, POST, PUT, DELETE]}
        href: {type: string}
        body:
          type: object
          description: Готовое тело запроса; поля-списки клиент заполняет сам.
    Actions:
      type: array
      items: {$ref: '#/components/schemas/Action'}
    Problem:
      type: object
      description: RFC 9457 и поле `code`. Дополнительные поля — только у кодов, где они названы.
      required: [type, title, status, code]
      properties:
        type: {type: string, example: 'urn:my-robot:problem:core-not-ready'}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code:
          type: string
          enum: [INVALID_REQUEST, UNAUTHORIZED, FORBIDDEN_HOST, NOT_FOUND, REPORT_NOT_READY,
                 ALREADY_RUNNING, STOPPING, NOT_RUNNING, MODE_CONFLICT, CORE_NOT_READY,
                 CONTOUR_DIR_BUSY, REVISION_CHANGED, INSTRUMENTS_REJECTED, BINDINGS_REJECTED,
                 HISTORY_UNAVAILABLE, INTERNAL, MARKET_DATA_NOT_READY]
        rejections:
          type: array
          description: Только у `INSTRUMENTS_REJECTED` (инструменты) и `BINDINGS_REJECTED` (привязки песочницы).
          items:
            oneOf:
              - {$ref: '#/components/schemas/Rejection'}
              - {$ref: '#/components/schemas/BindingRejection'}
        core:
          type: object
          description: Только у `CORE_NOT_READY` — кратко из `GET /api/v1/core`.
          properties:
            state: {type: string}
            attempts: {type: integer}
            next_retry_at: {type: string, format: date-time, nullable: true}
        pid: {type: integer, description: Только у `CONTOUR_DIR_BUSY`.}
        suggestions:
          type: array
          description: |
            Только у `NOT_FOUND` на маршрутах `/api/v1/candles…`: подходящие
            короткие имена инструментов или имеющиеся таймфреймы.
          items: {type: string}
    Rejection:
      type: object
      additionalProperties: false
      required: [instrument, reason]
      properties:
        instrument: {type: string, description: Имя из запроса как есть.}
        reason: {type: string}
    BindingRejection:
      type: object
      additionalProperties: false
      required: [binding, reason]
      properties:
        binding: {type: string, description: '`id` привязки из запроса как есть.'}
        reason: {type: string}

    # ------------------------------------------------------------- навигация
    Home:
      type: object
      additionalProperties: false
      required: [version, core, emulation, history, sandbox, live, _links]
      properties:
        version: {type: string}
        core:
          type: object
          required: [state]
          properties:
            state: {type: string, enum: [starting, ready, retrying, failed]}
        emulation:
          type: object
          nullable: true
          description: null — у ключа нет права на контуры.
          properties:
            state: {$ref: '#/components/schemas/TradingState'}
            instruments: {type: integer, minimum: 0}
            open_positions: {type: integer, minimum: 0, nullable: true}
        history:
          type: object
          nullable: true
          properties:
            running: {type: integer, minimum: 0}
            queued: {type: integer, minimum: 0}
            max: {type: integer, minimum: 1}
        sandbox:
          type: object
          nullable: true
          description: null — у ключа нет права на контуры.
          properties:
            state: {$ref: '#/components/schemas/TradingState'}
            bindings: {type: integer, minimum: 0}
            frozen: {type: integer, minimum: 0}
            reconcile: {type: string, nullable: true, enum: [ok, mismatch, skipped, null]}
        live:
          type: object
          nullable: true
          description: Пока всегда null — контур «Счёт» не реализован.
        _links: {$ref: '#/components/schemas/Links'}

    # ------------------------------------------------------------------ свечи
    Timeframe:
      type: string
      enum: [1m, 5m, 15m, 30m, 1h, 4h, 1d, 1w, 1M]
      description: Родной таймфрейм брокера.
    Candle:
      type: object
      additionalProperties: false
      required: [open_time, open, high, low, close, volume, complete]
      properties:
        open_time: {type: string, format: date-time, description: 'Время открытия свечи, UTC.'}
        open: {$ref: '#/components/schemas/DecimalPrice'}
        high: {$ref: '#/components/schemas/DecimalPrice'}
        low: {$ref: '#/components/schemas/DecimalPrice'}
        close: {$ref: '#/components/schemas/DecimalPrice'}
        volume: {type: integer, format: int64, minimum: 0, description: Объём в лотах.}
        complete:
          type: boolean
          description: '`false` — незавершённая текущая свеча; бывает только последней в ответе.'
    CandleSeries:
      type: object
      additionalProperties: false
      required: [instrument, instrument_type, timeframe, status, first_open_time, last_open_time, last_close, readiness, _links]
      description: Ряд свечей — пара «инструмент × таймфрейм» рыночной базы ядра.
      properties:
        instrument: {type: string, description: Короткое имя контракта или тикер акции.}
        instrument_type: {type: string, description: 'Тип инструмента у брокера: `future`, `share`, …', example: future}
        timeframe: {$ref: '#/components/schemas/Timeframe'}
        status:
          type: string
          enum: [active, retired]
          description: '`active` — пара нужна текущему составу; `retired` — больше не нужна, свечи остаются.'
        first_open_time: {type: string, format: date-time, nullable: true, description: Первая завершённая свеча; null — завершённых нет.}
        last_open_time: {type: string, format: date-time, nullable: true, description: Последняя завершённая свеча; null — завершённых нет.}
        last_close:
          type: string
          nullable: true
          pattern: '^-?[0-9]+(\.[0-9]+)?$'
          description: Цена закрытия последней завершённой свечи; null — завершённых нет.
        readiness:
          type: string
          nullable: true
          description: |
            Готовность живой пары, как в `GET /api/v1/core`: `READY`,
            `BOOTSTRAPPING`, `RECONCILING`, `GAP_HOLD`, `CONFLICT_HOLD`,
            `INTEGRITY_HOLD`; null — пара не живая.
        _links: {$ref: '#/components/schemas/Links'}
    CandleSeriesList:
      type: object
      additionalProperties: false
      required: [items, _links]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CandleSeries'}
        _links: {$ref: '#/components/schemas/Links'}
    CandlePage:
      type: object
      additionalProperties: false
      required: [instrument, instrument_type, timeframe, from, to, candles, _links]
      properties:
        instrument: {type: string, description: Каноническое имя — как в составе базы.}
        instrument_type: {type: string}
        timeframe: {$ref: '#/components/schemas/Timeframe'}
        from: {type: string, format: date-time, nullable: true, description: Начало окна из запроса; null — не ограничено.}
        to: {type: string, format: date-time, description: Конец окна — из запроса или момент ответа.}
        candles:
          type: array
          description: Последние `limit` свечей окна по возрастанию времени.
          items: {$ref: '#/components/schemas/Candle'}
        _links:
          allOf: [{$ref: '#/components/schemas/Links'}]
          description: '`self`, `series` — ряды этого инструмента, `earlier` — предыдущее окно, если раньше есть свечи.'

    # ------------------------------------------------------------------- ядро
    Core:
      type: object
      required: [state, error, attempts, next_retry_at, version, pid, started_at, heartbeat, market_data, quotas, _links]
      description: Поля — как `CoreState` в 1.8, и `_links`.
      properties:
        state: {type: string, enum: [starting, ready, retrying, failed]}
        error: {type: string, nullable: true}
        attempts: {type: integer, minimum: 0}
        next_retry_at: {type: string, format: date-time, nullable: true}
        version: {type: string}
        pid: {type: integer}
        started_at: {type: string, format: date-time, nullable: true}
        heartbeat:
          type: object
          nullable: true
          properties:
            beat_at: {type: string, format: date-time, nullable: true}
            interval_secs: {type: integer, minimum: 1}
        market_data:
          type: object
          nullable: true
          properties:
            producer_id: {type: string}
            pairs:
              type: object
              properties:
                total: {type: integer, minimum: 0}
                by_status:
                  type: object
                  additionalProperties: {type: integer, minimum: 0}
        quotas:
          type: object
          additionalProperties:
            type: object
            properties:
              per_minute: {type: integer, minimum: 0}
              ceiling: {type: integer, nullable: true}
              lanes: {type: object, additionalProperties: {type: integer, minimum: 0}}
              retry_after: {type: string, format: date-time, nullable: true}
        _links: {$ref: '#/components/schemas/Links'}

    # ------------------------------ общие части торговых контуров (эмуляция, счёт)
    TradingState:
      type: string
      enum: [waiting_command, starting, running, stopping_no_entries, stopping_close_all, stopped, failed]
      description: |
        Сводное состояние для человека. `starting` — процесс запущен, но ещё
        не подтвердил курсор ленты; `stopping_*` — процесс жив, целевое состояние —
        остановка; `stopped` — завершился штатно; `failed` — с ошибкой или
        не запустился.
    TradingMode:
      type: string
      enum: ['on', no_entries, close_all]
      description: |
        Режим торговли. `on` — торговать; `no_entries` — новых входов нет,
        сделки доживают, после последней процесс завершается; `close_all` —
        закрыть всё на открытии следующего бара и завершиться. `close_all`
        поверх `no_entries` принимается, обратно — `409 MODE_CONFLICT`.
    TradingTarget:
      type: object
      nullable: true
      additionalProperties: false
      required: [mode, revision]
      description: Целевое состояние торгового контура (в `core.sqlite3` — `desired`).
      properties:
        mode: {$ref: '#/components/schemas/TradingMode'}
        revision: {type: integer, minimum: 1, description: 'Номер ревизии целевого состояния; растёт с каждой командой, которая что-то меняет.'}
    TradingCurrent:
      type: object
      nullable: true
      additionalProperties: false
      required: [state, applied_revision, open_positions, pending_entries, last_tick_at, core_link]
      description: Текущее состояние из `status.json` контура (там — `actual`).
      properties:
        state: {type: string, nullable: true, enum: [running, stopping_no_entries, stopping_close_all, stopped, null]}
        applied_revision: {type: integer, minimum: 0, nullable: true}
        open_positions: {type: integer, minimum: 0, nullable: true}
        pending_entries: {type: integer, minimum: 0, nullable: true}
        last_tick_at: {type: string, format: date-time, nullable: true}
        core_link: {type: string, nullable: true, enum: [ok, lost, null]}
    TradingLaunch:
      type: object
      nullable: true
      additionalProperties: false
      required: [source, recovery, started_at, request, rejections]
      description: Как появился текущий процесс.
      properties:
        source: {type: string, nullable: true, enum: [api, cli, menu, null], description: '`cli` и `menu` — только у целевого состояния прежних версий.'}
        recovery:
          type: string
          nullable: true
          enum: [autostart, adopted, null]
          description: '`autostart` — поднят по целевому состоянию после рестарта; `adopted` — подхвачен живым.'
        started_at: {type: string, format: date-time, nullable: true}
        request:
          type: object
          nullable: true
          additionalProperties: false
          required: [mode]
          properties:
            mode: {type: string, enum: ['on']}
            instruments:
              type: array
              items: {type: string}
            bindings:
              type: array
              items: {type: string}
              description: Только у контура на брокере — `id` привязок.
          description: |
            Эквивалентная команда запуска — объектом, а не JSON строкой, как в 1.8.
            null — команда записана прежней версией в другом виде.
        rejections:
          type: array
          description: Отказы последней отклонённой команды.
          items: {$ref: '#/components/schemas/Rejection'}
    ContourProcess:
      type: object
      nullable: true
      additionalProperties: false
      required: [pid, exit_code, exited_at, dir]
      description: Процесс контура. Общая часть всех видов.
      properties:
        pid: {type: integer, nullable: true}
        exit_code: {type: integer, nullable: true}
        exited_at: {type: string, format: date-time, nullable: true}
        dir: {type: string, description: Папка контура относительно папки данных.}
    Member:
      type: object
      additionalProperties: false
      required: [name, instrument_type, days_to_expiry, target, remove_mode, current, _links, _actions]
      description: Участник состава торгового контура.
      properties:
        name: {type: string, description: 'Короткое имя контракта или тикер акции — то же, что в командах.'}
        instrument_type: {type: string, nullable: true, enum: [share, future, null]}
        days_to_expiry: {type: integer, nullable: true}
        target: {type: string, enum: [active, removed]}
        remove_mode: {type: string, nullable: true, enum: [no_entries, close_all, null]}
        current:
          type: string
          nullable: true
          enum: [warming, trading, draining, closing, null]
        _links: {$ref: '#/components/schemas/Links'}
        _actions: {$ref: '#/components/schemas/Actions'}
    MemberList:
      type: object
      additionalProperties: false
      required: [revision, items, _links, _actions]
      properties:
        revision: {type: integer, minimum: 1, nullable: true, description: Ревизия целевого состояния; null — проверка инструментов у брокера ещё идёт.}
        items:
          type: array
          items: {$ref: '#/components/schemas/Member'}
        _links: {$ref: '#/components/schemas/Links'}
        _actions: {$ref: '#/components/schemas/Actions'}
    TradingContour:
      type: object
      required: [state, target, current, launch, process, instruments, _links, _actions]
      description: Общая схема долгоживущего торгового контура — эмуляции и будущего «Счёта».
      properties:
        state: {$ref: '#/components/schemas/TradingState'}
        target:
          type: object
          allOf: [{$ref: '#/components/schemas/TradingTarget'}]
          nullable: true
          description: null — контур ни разу не запускали.
        current:
          type: object
          allOf: [{$ref: '#/components/schemas/TradingCurrent'}]
          nullable: true
        launch:
          type: object
          allOf: [{$ref: '#/components/schemas/TradingLaunch'}]
          nullable: true
        process:
          type: object
          allOf: [{$ref: '#/components/schemas/ContourProcess'}]
          nullable: true
        instruments:
          type: array
          items: {$ref: '#/components/schemas/Member'}
        _links: {$ref: '#/components/schemas/Links'}
        _actions: {$ref: '#/components/schemas/Actions'}

    # ------------------------------------------------------------- песочница
    Sandbox:
      type: object
      additionalProperties: false
      required: [state, target, current, launch, process, bindings, _links, _actions]
      description: |
        Контур «Песочница» на общих частях торгового контура. Отличия от
        эмуляции: участник состава — привязка, текущее состояние говорит о
        счёте брокера.
      properties:
        state: {$ref: '#/components/schemas/TradingState'}
        target:
          type: object
          allOf: [{$ref: '#/components/schemas/TradingTarget'}]
          nullable: true
        current:
          type: object
          allOf: [{$ref: '#/components/schemas/SandboxCurrent'}]
          nullable: true
        launch:
          type: object
          allOf: [{$ref: '#/components/schemas/TradingLaunch'}]
          nullable: true
        process:
          type: object
          allOf: [{$ref: '#/components/schemas/ContourProcess'}]
          nullable: true
        bindings:
          type: array
          items: {$ref: '#/components/schemas/BindingMember'}
        _links: {$ref: '#/components/schemas/Links'}
        _actions: {$ref: '#/components/schemas/Actions'}
    SandboxCurrent:
      type: object
      nullable: true
      additionalProperties: false
      required: [state, applied_revision, account, capital, positions, orders, stop_orders, frozen, last_reconcile_at, account_link, core_link, reason]
      description: Текущее состояние из `status.json` контура.
      properties:
        state: {type: string, nullable: true, enum: [running, stopped, failed, null]}
        applied_revision: {type: integer, minimum: 0, nullable: true}
        account: {type: string, nullable: true, description: 'Последние четыре символа номера счёта, например `…09c3`.'}
        capital:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            rub: {type: string, description: 'Рубли на счёте из GetPositions, десятичная строка.'}
            liquid_portfolio: {type: string, nullable: true, description: Из GetMarginAttributes; показывается рядом.}
        positions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, lots]
            properties:
              name: {type: string, description: Короткое имя контракта или тикер акции.}
              lots: {type: integer}
        orders: {type: integer, minimum: 0}
        stop_orders: {type: integer, minimum: 0}
        frozen:
          type: array
          items: {type: string}
          description: Замороженные сверщиком инструменты коротким именем.
        last_reconcile_at: {type: string, format: date-time, nullable: true}
        account_link: {type: string, nullable: true, enum: [ok, lost, null]}
        core_link: {type: string, nullable: true, enum: [ok, lost, null]}
        reason: {type: string, nullable: true, description: Причина отказа допуска или выхода.}
    BindingCard:
      type: object
      additionalProperties: false
      required: [id, instrument, strategy, timeframe, trades_in]
      description: Привязка конфигурации и где она сейчас торгует.
      properties:
        id: {type: string, description: '`id` привязки из `[strategies.*]`.'}
        instrument: {type: string, description: Тикер акции или код семейства фьючерса.}
        strategy: {type: string}
        timeframe: {type: string}
        trades_in:
          type: array
          items: {type: string, enum: [emulation, sandbox]}
    BindingMember:
      type: object
      additionalProperties: false
      required: [id, instrument, strategy, timeframe, target, remove_mode, current, _actions]
      description: Участник состава песочницы — привязка.
      properties:
        id: {type: string}
        instrument: {type: string}
        strategy: {type: string}
        timeframe: {type: string}
        target: {type: string, enum: [active, removed]}
        remove_mode: {type: string, nullable: true, enum: [no_entries, close_all, null]}
        current: {type: string, nullable: true, enum: [watching, null], description: '`watching` — на этапе С2 привязка в составе, но не торгует.'}
        _actions: {$ref: '#/components/schemas/Actions'}
    BindingsView:
      type: object
      additionalProperties: false
      required: [revision, members, available, _links, _actions]
      properties:
        revision: {type: integer, minimum: 1, nullable: true}
        members:
          type: array
          items: {$ref: '#/components/schemas/BindingMember'}
        available:
          type: array
          items: {$ref: '#/components/schemas/BindingCard'}
        _links: {$ref: '#/components/schemas/Links'}
        _actions: {$ref: '#/components/schemas/Actions'}
    SandboxStartRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: {type: string, enum: ['on']}
        bindings:
          type: array
          items: {type: string, minLength: 1}
          description: '`id` привязок; без поля — текущий состав.'
    SandboxTargetRequest:
      oneOf:
        - {$ref: '#/components/schemas/SandboxStartRequest'}
        - {$ref: '#/components/schemas/StopRequest'}
    BindingsAddRequest:
      type: object
      additionalProperties: false
      required: [bindings]
      properties:
        bindings:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
    BindingsRemoveRequest:
      type: object
      additionalProperties: false
      required: [bindings, mode]
      properties:
        bindings:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
        mode: {type: string, enum: [no_entries, close_all]}
    ReconcileReport:
      type: object
      nullable: true
      additionalProperties: false
      required: [at, account, result, items, frozen, skipped_in_row]
      properties:
        at: {type: string, format: date-time}
        account: {type: string, description: Последние четыре символа номера счёта.}
        result: {type: string, enum: [ok, mismatch, skipped]}
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [instrument, what, account, journal]
            properties:
              instrument: {type: string, description: Короткое имя.}
              what: {type: string, enum: [position, order, stop_order]}
              account: {type: integer, description: 'Лоты позиции или число заявок на счёте.'}
              journal: {type: integer, description: То же по журналу контура.}
        frozen:
          type: array
          items: {type: string}
        skipped_in_row: {type: integer, minimum: 0, description: Сколько сверок подряд пропущено из-за недоступного счёта.}

    # ------------------------------------------------------------- эмуляция
    Emulation:
      allOf:
        - {$ref: '#/components/schemas/TradingContour'}
      description: Контур эмуляции. Своих полей сверх общей схемы пока нет.
    StartRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: {type: string, enum: ['on']}
        instruments:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
          description: Тикеры акций и короткие имена контрактов; без поля — `all`.
    StopRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: {type: string, enum: [no_entries, close_all]}
    EmulationTargetRequest:
      oneOf:
        - {$ref: '#/components/schemas/StartRequest'}
        - {$ref: '#/components/schemas/StopRequest'}
    InstrumentsAddRequest:
      type: object
      additionalProperties: false
      required: [instruments]
      properties:
        instruments:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
          description: Тикеры акций и короткие имена контрактов.
    InstrumentsRemoveRequest:
      type: object
      additionalProperties: false
      required: [instruments]
      properties:
        instruments:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
          description: Тикеры акций и короткие имена контрактов из состава.
        mode: {type: string, enum: [no_entries, close_all], default: no_entries}

    # --------------------------------------------------------------- история
    HistoryRunRequest:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from: {type: string, example: '2026-09-01 10:00', description: 'ГГГГ-ММ-ДД ЧЧ:ММ; без зоны — UTC.'}
        to: {type: string, example: '2026-09-08 10:00', description: 'Конец, не входит в прогон.'}
        pause: {type: number, minimum: 0, default: 1, description: 'Пауза между тиками, секунд.'}
        instruments:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
          description: Тикеры акций, коды семейств (автоматическая цепочка) и короткие имена контрактов (фиксированный); без поля — `all`.
    HistoryRunState:
      type: string
      enum: [queued, starting, running, stopping, finished, stopped, failed, cancelled, interrupted]
    HistoryRun:
      type: object
      additionalProperties: false
      required: [id, state, request, accepted_at, started_at, finished_at, queue_position, reason,
                 market_data_sync, progress, process, _links, _actions]
      properties:
        id: {type: string, example: '20261024-101500'}
        state: {$ref: '#/components/schemas/HistoryRunState'}
        request: {$ref: '#/components/schemas/HistoryRunRequest'}
        accepted_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}
        queue_position: {type: integer, minimum: 1, nullable: true}
        reason: {type: string, nullable: true, description: 'Причина отказа, отмены или сбоя.'}
        market_data_sync:
          type: object
          nullable: true
          properties:
            status: {type: string, nullable: true}
            snapshot_generation: {type: integer, nullable: true}
        progress:
          type: object
          nullable: true
          description: Ход по рыночному времени из `status.json`; переименован из `actual`, чтобы не путать с `current` торговых контуров торговых контуров.
          properties:
            phase: {type: string, nullable: true, enum: [checking, running, finishing, null]}
            start: {type: string, format: date-time, nullable: true}
            end: {type: string, format: date-time, nullable: true}
            market_now: {type: string, format: date-time, nullable: true}
            ticks: {type: integer, nullable: true}
            fraction: {type: number, nullable: true, minimum: 0, maximum: 1}
        process:
          type: object
          allOf: [{$ref: '#/components/schemas/ContourProcess'}]
          nullable: true
        _links: {$ref: '#/components/schemas/Links'}
        _actions: {$ref: '#/components/schemas/Actions'}
    HistoryRunList:
      type: object
      additionalProperties: false
      required: [limits, items, _links]
      properties:
        limits:
          type: object
          required: [max, running, queued]
          properties:
            max: {type: integer, minimum: 0, description: '`[contours] max_history_runs`.'}
            running: {type: integer, minimum: 0}
            queued: {type: integer, minimum: 0}
        items:
          type: array
          items: {$ref: '#/components/schemas/HistoryRun'}
        _links: {$ref: '#/components/schemas/Links'}
    HistoryReport:
      type: object
      additionalProperties: false
      required: [covered, stop_reason, trades, net_pnl, fees, balance, open_positions, _links]
      properties:
        covered: {type: boolean}
        stop_reason: {type: string}
        trades: {type: integer, minimum: 0}
        net_pnl: {$ref: '#/components/schemas/Money'}
        fees: {$ref: '#/components/schemas/Money'}
        balance: {$ref: '#/components/schemas/Money'}
        open_positions:
          type: array
          items: {type: string}
        _links: {$ref: '#/components/schemas/Links'}

    # ------------------------------------- рыночные данные и кластеры (как в 1.8)
    SourceInfo:
      type: object
      additionalProperties: false
      required: [producer_id, schema_version, min_after_id, max_change_id]
      properties:
        producer_id:
          type: string
          format: uuid
          description: Постоянен до пересоздания локальной БД.
        schema_version:
          type: integer
          minimum: 1
        min_after_id:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Наименьший курсор, с которого доступна полная выдача. Растёт по
            правилу хранения ленты ([market_data] changes_retention_days), но
            не дальше наименьшего подтверждённого курсора потребителей;
            курсор меньше него получает 410.
        max_change_id:
          type: integer
          format: int64
          minimum: 0
    ChangePage:
      type: object
      additionalProperties: false
      required: [producer_id, next_after_id, has_more, changes]
      properties:
        producer_id:
          type: string
          format: uuid
        next_after_id:
          type: integer
          format: int64
          minimum: 0
          description: Последний change_id страницы либо исходный after_id при пустом ответе.
        has_more:
          type: boolean
        changes:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/CandleChange'
              - $ref: '#/components/schemas/IntervalStatusChange'
    ScheduleChangePage:
      type: object
      additionalProperties: false
      required: [producer_id, next_after_id, has_more, changes]
      properties:
        producer_id:
          type: string
          format: uuid
        next_after_id:
          type: integer
          format: int64
          minimum: 0
          description: Последний change_id страницы (schedule_change_id) либо исходный after_id при пустом ответе.
        has_more:
          type: boolean
        changes:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/ScheduleDayChange'
              - $ref: '#/components/schemas/ScheduleBindingChange'
    ScheduleDayChange:
      type: object
      additionalProperties: false
      required: [change_id, kind, source, exchange, observed_at, day]
      properties:
        change_id: {type: integer, format: int64, minimum: 1}
        kind: {type: string, enum: [schedule_day]}
        source: {type: string, example: tbank}
        exchange:
          type: string
          description: Код режима торгов в нижнем регистре.
          example: moex_mrng_evng_e_wknd_dlr
        observed_at: {type: string, format: date-time}
        day:
          type: object
          additionalProperties: false
          required: [trading_date, version, raw_json, is_trading_day, last_confirmed_at]
          properties:
            trading_date: {type: string, format: date, description: Торговая дата по МСК.}
            version: {type: string, description: sha256 канонического JSON исходного TradingDay.}
            raw_json: {type: string, description: Канонический JSON исходного TradingDay (UTC ISO).}
            is_trading_day: {type: boolean}
            last_confirmed_at: {type: string, format: date-time}
    ScheduleBindingChange:
      type: object
      additionalProperties: false
      required: [change_id, kind, source, exchange, instrument_uid, observed_at]
      properties:
        change_id: {type: integer, format: int64, minimum: 1}
        kind: {type: string, enum: [schedule_binding]}
        source: {type: string, example: tbank}
        exchange: {type: string, description: Код режима торгов в нижнем регистре.}
        instrument_uid: {type: string}
        observed_at: {type: string, format: date-time}
    CandleChange:
      type: object
      additionalProperties: false
      required: [change_id, kind, recorded_at, candle]
      properties:
        change_id:
          type: integer
          format: int64
          minimum: 1
        kind:
          type: string
          enum: [candle_upsert]
        recorded_at:
          type: string
          format: date-time
        candle:
          $ref: '#/components/schemas/CompleteCandle'
    IntervalStatusChange:
      type: object
      additionalProperties: false
      required: [change_id, kind, recorded_at, interval_status]
      properties:
        change_id:
          type: integer
          format: int64
          minimum: 1
        kind:
          type: string
          enum: [interval_status]
        recorded_at:
          type: string
          format: date-time
        interval_status:
          $ref: '#/components/schemas/IntervalStatus'
    CompleteCandle:
      type: object
      additionalProperties: false
      required: [source, instrument_uid, interval, open_time_utc, open, high, low, close, volume, is_complete, revision, received_at]
      properties:
        source:
          type: string
          description: Идентификатор брокерского источника и типа свечи.
        instrument_uid:
          type: string
          minLength: 1
        interval:
          type: string
          minLength: 1
          example: 1m
        open_time_utc:
          type: string
          format: date-time
        open:
          $ref: '#/components/schemas/DecimalPrice'
        high:
          $ref: '#/components/schemas/DecimalPrice'
        low:
          $ref: '#/components/schemas/DecimalPrice'
        close:
          $ref: '#/components/schemas/DecimalPrice'
        volume:
          type: integer
          format: int64
          minimum: 0
        is_complete:
          type: boolean
          enum: [true]
        revision:
          type: integer
          minimum: 1
        received_at:
          type: string
          format: date-time
    DecimalPrice:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      description: Десятичное число строкой для сохранения точности.
      example: '301.75'
    IntervalStatus:
      type: object
      additionalProperties: false
      required: [source, instrument_uid, interval, open_time_utc, state, observed_at, evidence]
      properties:
        source:
          type: string
        instrument_uid:
          type: string
          minLength: 1
        interval:
          type: string
          example: 1m
        open_time_utc:
          type: string
          format: date-time
        state:
          type: string
          enum: [received, scheduled_closed, confirmed_no_trade, pending, unresolved]
        observed_at:
          type: string
          format: date-time
        evidence:
          type: string
          minLength: 1
          description: Источник и основание классификации интервала.
    CheckpointRequest:
      type: object
      additionalProperties: false
      required: [producer_id, change_id]
      properties:
        producer_id:
          type: string
          format: uuid
        change_id:
          type: integer
          format: int64
          minimum: 0
    CheckpointResponse:
      type: object
      additionalProperties: false
      required: [producer_id, consumer_id, acknowledged_through]
      properties:
        producer_id:
          type: string
          format: uuid
        consumer_id:
          type: string
        acknowledged_through:
          type: integer
          format: int64
          minimum: 0
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          example: CURSOR_EXPIRED
        message:
          type: string
    Decimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      description: Десятичное число строкой.
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount: {$ref: '#/components/schemas/Decimal'}
        currency: {type: string, example: RUB}
    HalLink:
      type: object
      additionalProperties: false
      required: [href]
      properties:
        href:
          type: string
          description: Относительный адрес ресурса.
    ClusterVerdict:
      type: string
      enum: [veto_strong, veto, confirm, neutral, unknown]
      description: |
        veto_strong — запрет и цена у края 2ч диапазона по направлению входа;
        veto — запрет; confirm — подтверждение; neutral — без влияния;
        unknown — кластерных данных нет, вход пропущен как без фильтра.
    ClusterVerdictReason:
      type: string
      enum: [climax, initiative, no_evidence, no_coverage, contract_mismatch, data_degraded, consumer_lag, no_sigma_history, candles_missing]
    PriceMoveStats:
      type: object
      additionalProperties: false
      required: [n]
      properties:
        n:
          type: integer
          minimum: 0
          description: Сигналов, у которых горизонт уже наступил.
        mean_bps:
          allOf: [{$ref: '#/components/schemas/Decimal'}]
          nullable: true
        median_bps:
          allOf: [{$ref: '#/components/schemas/Decimal'}]
          nullable: true
        hit_rate:
          allOf: [{$ref: '#/components/schemas/Decimal'}]
          nullable: true
          description: Доля сигналов, после которых цена пошла в их сторону (0..1).
    PriceMove:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, final, no_data]
        move_bps:
          allOf: [{$ref: '#/components/schemas/Decimal'}]
          nullable: true
    ClustersReportGroup:
      type: object
      additionalProperties: false
      required: [verdict, signals, trades, trades_net_pnl, trades_won, trades_lost, price_move]
      properties:
        verdict: {$ref: '#/components/schemas/ClusterVerdict'}
        signals: {type: integer, minimum: 0}
        trades:
          type: integer
          minimum: 0
          description: Сколько сигналов группы стали сделкой (есть исполнение).
        trades_net_pnl: {$ref: '#/components/schemas/Money'}
        trades_won: {type: integer, minimum: 0}
        trades_lost: {type: integer, minimum: 0}
        price_move:
          type: object
          description: Ключ — горизонт в минутах из horizons_min.
          additionalProperties: {$ref: '#/components/schemas/PriceMoveStats'}
    ClustersReportSignal:
      type: object
      additionalProperties: false
      required: [signal_id, bar_close, instrument, assignment_id, strategy, timeframe, side, price, verdict, reason, message, trade, price_move]
      properties:
        signal_id:
          type: string
          description: Идентификатор входного события стратегии; по нему вердикт связан со сделкой.
        bar_close: {type: string, format: date-time}
        instrument:
          type: string
          description: Тикер контракта или акции (BRX6, SBER).
        assignment_id: {type: string}
        strategy: {type: string}
        timeframe: {type: string, example: 5m}
        side:
          type: string
          enum: [BUY, SELL]
        price: {$ref: '#/components/schemas/Decimal'}
        verdict: {$ref: '#/components/schemas/ClusterVerdict'}
        reason: {$ref: '#/components/schemas/ClusterVerdictReason'}
        message:
          type: string
          description: Тот же текст, что был в консоли в строке «Кластеры».
        trade:
          type: object
          nullable: true
          description: null — сигнал не стал сделкой.
          additionalProperties: false
          required: [trade_id, net_pnl]
          properties:
            trade_id: {type: string}
            net_pnl:
              allOf: [{$ref: '#/components/schemas/Money'}]
              nullable: true
              description: null — сделка ещё открыта.
        price_move:
          type: object
          additionalProperties: {$ref: '#/components/schemas/PriceMove'}
    ClustersReport:
      type: object
      additionalProperties: false
      required: [period, mode, generated_at, horizons_min, groups, veto_effect, signals, _links]
      properties:
        period:
          type: object
          additionalProperties: false
          required: [from, to, days]
          properties:
            from: {type: string, format: date}
            to: {type: string, format: date}
            days: {type: integer, minimum: 1}
        mode:
          type: string
          enum: [off, shadow, enforce, mixed]
          description: Режим фильтра у привязок в периоде; mixed — режимы различались.
        generated_at: {type: string, format: date-time}
        horizons_min:
          type: array
          items: {type: integer}
        groups:
          type: array
          description: Только группы, в которых есть хотя бы один сигнал.
          items: {$ref: '#/components/schemas/ClustersReportGroup'}
        veto_effect:
          type: object
          additionalProperties: false
          required: [includes, trades_removed, winners_removed, winners_net_pnl, losers_removed, losers_net_pnl, net_effect]
          properties:
            includes:
              type: array
              items: {$ref: '#/components/schemas/ClusterVerdict'}
            trades_removed: {type: integer, minimum: 0}
            winners_removed: {type: integer, minimum: 0}
