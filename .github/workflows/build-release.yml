name: build-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.13.1'

jobs:
  build:
    name: robot ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
        fail-fast: false
        matrix:
          include:
          - os: macos-14
            platform: macos-arm64
            suffix: ''
            architecture: arm64
          - os: windows-2022
            platform: windows-x64
            suffix: '.exe'
            architecture: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Resolve release tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ inputs.release_tag }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install --trusted-host opensource.tbank.ru -r requirements.txt -r requirements-dev.txt -r requirements-build.txt

      - name: Validate release metadata
        shell: bash
        run: python -m scripts.validate_release --tag "$RELEASE_TAG"

      - name: Run tests
        shell: bash
        run: python -m pytest -q

      - name: Run Ruff
        shell: bash
        run: python -m ruff check . --exclude tools --exclude openspec/_check_sync.py

      - name: Verify native architecture
        shell: bash
        run: test "$(uname -m)" = "${{ matrix.architecture }}"

      - name: Build distribution
        shell: bash
        run: python -m scripts.build_distribution --tag "$RELEASE_TAG" --platform "${{ matrix.platform }}" --dist-dir release-dist

      - name: Smoke frozen binary
        shell: bash
        run: |
          binary="release-dist/robot-${RELEASE_TAG}-${{ matrix.platform }}/robot-${RELEASE_TAG}-${{ matrix.platform }}${{ matrix.suffix }}"
          "$binary" --version
          "$binary" --config-smoke
          "$binary" --telegram-chart-smoke

      - name: Upload checked distribution
        uses: actions/upload-artifact@v4
        with:
          name: robot-${{ matrix.platform }}
          path: release-dist/*.zip

  publish:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve release tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ inputs.release_tag }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi

      - name: Validate release metadata and write notes
        shell: bash
        run: python -m scripts.validate_release --tag "$RELEASE_TAG" --notes-file release-notes.md

      - name: Download checked distributions
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: (cd release-assets && sha256sum *.zip > checksums.txt)

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: |
            release-assets/*.zip
            release-assets/checksums.txt
