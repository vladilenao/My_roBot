# Вшиваемые в сборку дефолты конфигурации.
# Используются, когда рядом с исполняемым файлом нет robot.toml.
# Не изменяйте этот файл на вашей машине: он попадает внутрь сборки.

[robot]
timeframe = "1h"
sleep_seconds = 3600
heartbeat_every_ticks = 60

[tick]
poll_secs = 1
timeout_secs = 65

[instruments]
fallback_type = "future"
fallback_ticker = "NGU6"

[notifier]
channel = "console"

# Покрытие всех форм привязки: строка (дефолты), инлайн-таблица с raw /
# basic_levels, дубликаты стратегий; каскад ТФ: глобальный 1h, timeframe
# тикера (NG → 15m), точечный tf в инлайне, дубли на разных ТФ.
[strategies.share.SBER]
strategies = [
    { name = "macd_rsi_stoch", filter = "raw", tf = "15m" },  # скальпер без фильтров на 15m
    { name = "macd_rsi_stoch", filter = "basic_levels" },     # та же стратегия на 1h с фильтром
    "flat_triangle",                                          # строка → дефолты (1h, basic_levels)
    { name = "ma_cloud_rsi_macd", filter = "raw" },
]

[strategies.future.NG]
timeframe = "15m"        # база тикера: всё без явного tf работает на 15m
strategies = [

    { name = "flat_triangle", filter = "raw" },
    { name = "macd_rsi_stoch", tf = "15m",filter = "basic_levels" },
    { name = "ma_cloud_rsi_macd", tf = "1h", filter = "triple_screen" },  # Элдер на часовике
]

[strategies.future.BR]
strategies = [
    { name = "macd_rsi_stoch", filter = "raw", tf = "5m" },
    "flat_triangle",
    { name = "harmonic_abcd", filter = "raw" },
    { name = "ma_cloud_rsi_macd", tf = "15m" },
]

# Сценарий сравнения привязок: SI — один инструмент, один ТФ (5m), две
# привязки ma_cloud_rsi_macd с разными профилями фильтрации (raw / triple_screen).
# Сценарий пришёл на смену дубликату имени стратегии на 1h (перекрёстный ТФ
# с дефолтным профилем) и стратегиям macd_rsi_stoch/flat_triangle на 1h.
# Обе привязки делят один инстанс стратегии и выдают одинаковое решение;
# расхождение возможно только после фильтра. Повторный вход того же бара
# отсекает брокер: в журнале причина `duplicate`.
[strategies.future.SI]
strategies = [
    { name = "ma_cloud_rsi_macd", filter = "raw", tf = "5m" },
    { name = "ma_cloud_rsi_macd", filter = "triple_screen", tf = "5m" },
]

[strategies.future.ED]
strategies = [
    { name = "flat_triangle", filter = "raw", tf = "15m" },
    { name = "macd_rsi_stoch", filter = "basic_levels" },
    "harmonic_abcd",
    "ma_cloud_rsi_macd",
]

# Профиль фильтрации triple_screen (методика Элдера):
# множитель иерархии ТФ, параметры MACD/Stochastic, пороги зон %K.
# Используется привязками с filter = "triple_screen".
[strategies.filter.triple_screen]
multiplier = 5
macd_fast = 12
macd_slow = 26
macd_signal = 9
stoch_k = 14
stoch_d = 3
stoch_smooth_k = 3
oversold = 20
overbought = 80

[logging]
service_uid = "b7e3a1c4-92f8-4d5e-a016-7f8b2c3d4e5a"
file = "bot_debug.log"
level = "DEBUG"
max_bytes = 10485760
backup_count = 5