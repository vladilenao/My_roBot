# Вшиваемые в сборку дефолты конфигурации.
# Используются, когда рядом с исполняемым файлом нет robot.toml.
# Не изменяйте этот файл на вашей машине: он попадает внутрь сборки.

[robot]
timeframe = "1h"
sleep_seconds = 3600
heartbeat_every_ticks = 60
data_dir = "data"

[tick]
poll_secs = 1
timeout_secs = 300

# Локальная база живых завершённых свечей и локальный HTTP API робота
# (экспорт рыночных данных и отчёт кластерного фильтра, контракт docs/api/openapi.yaml,
# Swagger UI — http://127.0.0.1:8101/docs). API запускается, только если
# в .env задан MARKET_DATA_EXPORT_TOKEN; без токена робот работает без API.
[market_data]
database_file = "market-data.sqlite3"
export_enabled = true
export_host = "127.0.0.1"
export_port = 8101
# Транспорт live-свечей: "polling" или "stream" (подписка с резервным опросом).
# Параметры приёма и восстановления — docs/market-data/live-ingestion.md; их
# значения по умолчанию — инженерный профиль, а не гарантия брокера.
# Stream выбран после read-only пробы брокера (8.5); откат — "polling".
live_transport = "stream"

# Паттерны завершённых свечей пишутся в Redis Stream market.events.
# Пароль задаётся только переменной окружения MARKET_STRUCTURE_REDIS_PASSWORD.
[market_structure]
patterns_enabled = true  # Включает публикацию свечных паттернов только в live-режиме.
redis_host = "127.0.0.1"  # Имя хоста или IP-адрес Redis.
redis_port = 6379  # TCP-порт Redis.
redis_db = 0  # Номер логической базы Redis для stream market.events.
queue_maxsize = 1024  # Максимум необработанных закрытых свечей в фоновой очереди.
retention_days = 90  # Сколько суток хранить события в Redis Stream; более старые удаляются.

# Контур эмуляции — отдельный процесс (data/contours/emulation/), читает свечи
# из ленты ядра и передаёт ему потребности строками в рыночной базе.
[contours]
feed_poll_secs = 1  # Как часто контур читает ленту, а ядро — потребности контуров, секунд.
demand_release_secs = 900  # Через сколько секунд ядро снимает пару, которая не нужна ни одному контуру и ни одной сделке.
heartbeat_secs = 5  # Как часто ядро бьёт пульс, а контур его читает, секунд.
heartbeat_timeout_secs = 30  # Без пульса ядра дольше этого контур не входит в новые сделки (сопровождение продолжается).
autostart = true  # Поднимать контур эмуляции, когда ядро готово, если перед остановкой он работал.
max_history_runs = 2  # Сколько прогонов истории идёт одновременно (1–8), остальные ждут в очереди.

[contours.emulation]
telegram_channel_env = "TELEGRAM_CHANNEL_ID"  # Имя переменной .env с id канала Telegram контура (сам id — только в .env).

[contours.sandbox]
telegram_bot_env = "TELEGRAM_ACCOUNT_BOT_TOKEN"  # Имя переменной .env с токеном бота контура «Песочница».
telegram_channel_env = "TELEGRAM_SANDBOX_CHANNEL_ID"  # Имя переменной .env с id канала «Песочница».
reconcile_every_min = 1  # Как часто сверять счёт песочницы с журналом контура, минут (1–60). Состав — только командами API.
orders = true  # Торговать привязками заявками; false — только читать и сверять счёт.
exit_offset_steps = 5  # Запас лимита выхода (стоп, сигнал, закрытие) в шагах цены, 0–100.
exit_requote_secs = 15  # Сколько ждать исполнения лимита выхода до перевыставления, секунд (5–300).
exit_requote_attempts = 3  # Перевыставлений до аварийного выхода по рынку (1–10).

[instruments]
fallback_type = "future"
fallback_ticker = "NGU6"

# Автоматическая историческая цепочка. Без lead_days семейство наследует
# trading.contract_expiry_block_days; индивидуальный срок может быть только больше.
[historical.rollover]
policy = "calendar"
# Пример: [historical.rollover.families.BR] lead_days = 3

# Лог исторического прогона (bot_debug.log в папке прогона HIST/...). Боевой режим
# использует [logging]. По умолчанию INFO и без ротации: лог прогона целиком.
[historical.logging]
level = "INFO"            # порог лога прогона: DEBUG/INFO/WARNING/ERROR
max_bytes = 0             # размер файла до ротации; 0 — без ротации (лог не теряется)
backup_count = 0          # ротационных копий при max_bytes > 0
# Окно отладки по рыночному времени: внутри него пишется и DEBUG.
# Формат ГГГГ-ММ-ДД ЧЧ:ММ; без зоны — UTC (как границы прогона), «+03:00» — МСК.
# Пример: debug_from = "2025-08-07 14:00+03:00" и debug_to = "2025-08-07 18:00+03:00"
debug_from = ""
debug_to = ""

# Расписание исторического прогона. Эмулятор отдаёт для прошедших дат
# восстановленное расписание (окна по правилам сессий, торговые дни по барам).
# Оно применяется только сессионной защитой внутридневных сделок и никогда не
# доказывает отсутствие свечей. false — прогон без восстановленного расписания.
[historical.schedule]
use_reconstructed = true

[notifier]
# Каналы доставки уведомлений в порядке подписки: "console" | "telegram".
# Старый ключ channel = "telegram" поддерживается как channels = ["telegram"].
channels = ["console","telegram"]

[notifier.console]
# Консоль — источник истины: по умолчанию все пользовательские уведомления.
# Границы тика доставляются ей технически и здесь не перечисляются.
events = [
    "clearing_done", "decision", "error", "heartbeat", "order_accepted", "order_rejected",
    "position_added", "protection_armed", "rate_limited", "rejected", "reservation_changed",
    "risk_limit_hit", "signal", "startup_analysis", "market_data_status", "stop_hit", "stop_moved", "target_hit", "trade_cancelled",
    "trade_closed", "trade_opened"
]

[notifier.telegram]
# В Telegram по умолчанию только торговые события, без служебных.
events = [
    "signal", "stop_hit", "target_hit", "trade_closed", "trade_opened",
    "position_added", "stop_moved", "trade_cancelled", "order_rejected"
]
# Таймаут одного HTTP-запроса Bot API, секунд. Прокси Cloudflare под 10 с
# не успевает (ReadTimeout на sendPhoto), а при 30 с загрузка фото дважды
# не уложилась — 60 с запасом на медленный аплинк.
request_timeout = 60
# Общее число транспортных попыток на доставку: 2 = один повтор при таймауте
# или обрыве, пока карточка не подтверждена message_id.
max_transport_attempts = 2

# Явные привязки с глобальными ID и профилями управления; каскад ТФ: глобальный 1h, timeframe
# тикера (NG → 15m), точечный tf в инлайне, дубли на разных ТФ.
[strategies.share.SBER]
strategies = [
    { id = "share-sber-macd-4h-triple", name = "macd_rsi_stoch", management = "levels_rr", filter = "triple_screen", tf = "4h", priority = 10, clusters = "shadow" },
