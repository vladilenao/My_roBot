# Сценарий сравнения привязок: SI — один инструмент, один ТФ (5m), две
# привязки ma_cloud_rsi_macd с разными профилями фильтрации (raw / triple_screen).
# Сценарий пришёл на смену дубликату имени стратегии на 1h (перекрёстный ТФ
# с дефолтным профилем) и стратегиям macd_rsi_stoch/flat_triangle на 1h.
# Обе привязки делят один инстанс стратегии и выдают одинаковое решение;
# расхождение возможно только после фильтра. Повторный вход того же бара
# отсекает брокер: в журнале причина `duplicate`.
[strategies.future.SI]
strategies = [
    { id = "future-si-ma-raw", name = "ma_cloud_rsi_macd", management = "ma_cloud", filter = "raw", tf = "5m", priority = 10 },
    { id = "future-si-ma-triple", name = "ma_cloud_rsi_macd", management = "ma_cloud", filter = "triple_screen", tf = "5m", priority = 10 },
]

[strategies.future.ED]
strategies = [
    { id = "future-ed-flat", name = "flat_triangle", management = "levels_rr", filter = "raw", tf = "15m", priority = 5 },
    { id = "future-ed-macd", name = "macd_rsi_stoch", management = "levels_rr", filter = "basic_levels", priority = 10, clusters = "shadow" },
    { id = "future-ed-harmonic", name = "harmonic_abcd", management = "pattern_targets", priority = 10 },
    { id = "future-ed-ma", name = "ma_cloud_rsi_macd", management = "ma_cloud", priority = 10 },
]

# Кластерный фильтр входа «Кластеры» на событиях ClusterSource (Redis Stream
# cluster.events; подключение — из [market_structure], пароль —
# MARKET_STRUCTURE_REDIS_PASSWORD). Режим задаётся у привязки ключом clusters:
# "off" — выключен, "shadow" — вердикт виден в консоли и в отчёте, допуск не
# меняется, "enforce" — запрет даёт недопуск cluster-climax. Ниже — значения
# по умолчанию; раскомментируйте, чтобы изменить.
# [clusters]
# stream = "cluster.events"        # поток ClusterSource
# consumer_group = "robot-v1"      # Consumer Group робота
# pre_move_veto_sigma = 1.5        # ход до входа (в σ15), после которого ищется кульминация
# initiative_max_sigma = 0.5       # событие при ходе меньше этого — инициатива
# extreme_position = 0.8           # «у края 2ч диапазона» — сильный запрет
# climax_window_min = 30           # окно поиска кульминации, минут
# initiative_window_min = 60       # окно поиска инициативы, минут
# sigma_days = 10                  # торговых дней 1m истории для σ15
# max_consumer_lag_sec = 60        # чтение Redis отстаёт сильнее — вердикт unknown
# enforce_level = "veto"           # в enforce запрещает veto и veto_strong; "veto_strong" — только сильный

# Профиль фильтрации triple_screen (методика Элдера):
# множитель иерархии ТФ, параметры MACD/Stochastic, пороги зон %K.
# Используется привязками с filter = "triple_screen".
#
# Три экрана: 1) направление тренда на старшем ТФ — наклон гистограммы MACD;
# 2) фаза коррекции на среднем ТФ — положение %K Stochastic относительно зон;
# 3) входящий сигнал базовой стратегии на рабочем ТФ.
[strategies.filter.triple_screen]
multiplier = 5        # множитель иерархии ТФ Элдера (>= 2): средний ТФ ≈ работа × множитель,
                      # старший ТФ ≈ средний × множитель (берётся ближайший больший стандартный)
macd_fast = 12        # быстрая EMA MACD на старшем ТФ (экран 1); должна быть < macd_slow
macd_slow = 26        # медленная EMA MACD на старшем ТФ
macd_signal = 9       # сигнальная EMA гистограммы MACD; должна быть < macd_slow
stoch_k = 14          # период %K Stochastic на среднем ТФ (экран 2); >= stoch_d
stoch_d = 3           # период сглаживания %D Stochastic (сигнальная линия)
stoch_smooth_k = 3    # внутреннее сглаживание %K до расчёта %D
oversold = 20         # порог перепроданности %K (0..100): ниже него коррекция допускает лонг; < overbought
overbought = 80       # порог перекупленности %K (0..100): выше него коррекция допускает шорт

[logging]
service_uid = "b7e3a1c4-92f8-4d5e-a016-7f8b2c3d4e5a"  # идентификатор экземпляра робота в строках лога
file = "bot_debug.log"                                # имя debug-лога внутри runtime-каталога (data/)
level = "DEBUG"                                       # порог логирования: DEBUG/INFO/WARNING/ERROR
max_bytes = 10485760                                  # максимальный размер одного файла лога до ротации (10 МБ)
backup_count = 5                                      # сколько ротационных копий (bot_debug.log.1…N) хранить
audit_file = "trade_decision_trace.log"               # лента расчётов менеджмента (трейсы калькуляторов risk/stops)
audit_max_bytes = 10485760                            # размер audit-файла до ротации
audit_backup_count = 5                                # число хранимых ротационных копий audit-файла

[trading]
initial_deposit = 100000                              # стартовый капитал счёта (в валюте счёта), база для risk-лимитов
max_risk_pct = 2.0                                    # совместимость legacy API; допуск использует единый risk_limits.portfolio_pct
database_file = "trades.sqlite3"                      # durable-журнал сделок (SQLite) внутри runtime-каталога
journal_file = "trade_event.csv"                      # append-only лента сделок (CSV-проекция журнала)
positions_file = "trade_summary.csv"                  # карточки открытых позиций (CSV-проекция журнала)
clearing_times = ["14:05", "19:00"]                   # времена дневного клиринга (МСК): исполнение сделок приостановлено
contract_expiry_block_days = 2                        # порог экспирации фьючерсов: вход запрещён и сделки закрываются за N календарных суток до экспирации
contract_expiry_close_before_end_min = 20             # порог в перерыве (ночь, выходные, клиринг) сдвигается на конец последней сессии минус N минут

# Фильтр разрешённых направлений входов по типам инструментов (опционально).
# Каждый ключ — тип инструмента, значение — список направлений long и/или short.
# Секция и незаданные в ней типы означают «разрешены обе стороны»; поведение
# по умолчанию без секции не меняется. Раскомментируйте и настройте при
# необходимости, например:
[trading.directions]
future = ["long", "short"]     # фьючерсы: и лонг, и шорт
share  = ["long"]              # акции: только лонг

# Сессионная защита внутридневных сделок: короткие сделки входят только в
# разрешённых сессиях по расписанию брокера и не переносятся через закрытие
# торгового дня без защиты. Сделки на 1h и выше (свинговые) не затрагиваются.
[trading.intraday]
enabled = true                       # выключатель правила целиком
max_timeframe = "15m"                # сделки с таймфреймом плана не больше этого — внутридневные
entry_sessions = ["morning", "main"] # сессии входа: morning (утренняя), main (основная),
                                     # evening (вечерняя), weekend (выходного дня)
no_entry_before_close_min = 60       # не открывать сделки позже чем за N минут до конца разрешённых сессий
flatten_before_close_min = 20        # закрывать позиции за N минут до конца разрешённых сессий
                                     # (не больше no_entry_before_close_min)
keep_if_tp1_and_breakeven = true     # не закрывать позицию, если первая цель взята и стоп
                                     # в безубытке всей сделки (или переносится в него)

[trading.risk_limits]
max_entry_deviation_r = 0.25 # неблагоприятное движение от входа / расстояние вход–стоп
portfolio_pct = 2.0     # единый риск всех открытых остатков и pending-входов, % от min(balance, equity)
# Старые trade_pct, instrument_pct и groups нужно удалить из robot.toml:
# отдельные процентные квоты заменены единым portfolio_pct, молчаливой миграции нет.
max_qty = 10            # верхняя граница размера входа: не более такого числа контрактов на сделку
commission = 1.5        # ₽ на контракт за одну сторону; оценка круга = 2 × commission
slippage = 1.0          # ₽ на контракт за полный круг; запас пополам на вход и выход
slippage_tolerance = 0.005  # допуск гэпа на входе, доля от цены сигнала: вход исполняется по цене,
                           # ушедшей от сигнальной дальше этой доли — позиция признаётся аварийной
min_trade_risk_pct = 0.0   # минимальный риск сделки, % от баланса: вход с меньшим риском
                           # (например, из-за нехватки бюджета) отклоняется, а не урезается молча
min_risk_cost_ratio = 2.0 # минимум риска до стопа / оценки круговых издержек; 0 выключает
min_net_payoff = 1.5      # минимум чистой плановой прибыли / риска полного выхода; 0 выключает
max_slippage_r = 0.25     # максимум запаса проскальзывания / риска; 0 выключает ограничение

# Профили управления открытой позицией. Привязка происходит в [strategies.*] через
# ключ management; параметры читаются на этапе планирования и на закрытии каждого бара
# таймфрейма сделки: стоп и сигнальные выходы считаются только по барам этого таймфрейма.
[trade_management.profiles.levels_rr]
type = "levels_rr"  # профиль: риск-доходность от уровней поддержки/сопротивления
buffer_ticks = 1    # отступ стопа от S/R в шагах цены
target_R = [1.0, 2.0]     # тейки в долях риска (R): 1.0×R и 2.0×R от точки входа
shares = [0.5, 0.5]       # доля позиции, закрываемая на каждом тейке (сумма ≤ 1)
max_adds = 0              # максимум докуток (пирамидинга) на прибыльном движении
min_be_r = 1.5            # BE после TP1 только при текущем продвижении не меньше 1.5 исходных R
min_stop_atr = 1.5        # общая геометрия стопа (одна и та же во всех профилях, см. комментарий ниже)
min_stop_ticks = 10
stop_beyond_bar = 1.0
max_stop_atr = 6.0

[trade_management.profiles.atr_trend]
type = "atr_trend"  # профиль: стоп по ATR, фиксация TP1, далее трейлинг остатка
atr_period = 14       # период ATR (прогрев индикатором; фрейм должен быть длиннее)
initial_k = 2.0       # начальный стоп = K × ATR от точки входа
trail_k = 2.0         # трейлинг-стоп = K × ATR от экстремума движения
target_R = [1.0, 2.0] # возрастающая лестница целей в исходных R
shares = [0.25, 0.25] # целые floor-доли на целях; остаток продолжает трейлинг
max_adds = 2          # максимум докуток в фазе пирамидинга (до срабатывания TP1)
add_fraction = 0.5    # размер докутки как доля от текущего объёма позиции
advance_R = 0.5       # минимальное продвижение цены (в R) от последнего входа для докутки
min_stop_atr = 1.5        # общая геометрия стопа: собственная формула профиля (initial_k × ATR)
min_stop_ticks = 10      # подчиняется тому же полу, что и остальные профили
stop_beyond_bar = 1.0
max_stop_atr = 6.0

[trade_management.profiles.ma_cloud]
type = "ma_cloud"      # профиль: стоп по облаку скользящих средних, частичный выход и ретест-докутка
ma_fast_period = 10    # быстрая MA (верхняя граница облака для BUY)
ma_slow_period = 40    # медленная MA (нижняя граница облака; пробой — принудительный выход)
buffer_ticks = 1       # отступ стопа от границы облака в шагах цены
max_adds = 2           # максимум докуток на возврате цены к облаку
add_fraction = 0.5     # размер докутки как доля от текущего объёма позиции
min_stop_atr = 1.5        # общая геометрия стопа: стоп за границей облака тоже ограничен волатильностью
min_stop_ticks = 10
stop_beyond_bar = 1.0
max_stop_atr = 6.0

[trade_management.profiles.pattern_targets]
type = "pattern_targets"  # профиль: цели AB=CD (паттерн гармоники), стоп за точкой C
min_be_r = 1.5            # порог текущего продвижения для BE всей сделки после TP1
buffer_ticks = 1          # отступ стопа от точки C в шагах цены
fractions_to_D = [0.5, 1.0]  # доли расстояния до цели D: 0.5 — мидпоинт, 1.0 — сама D
shares = [0.5, 0.5]          # доля позиции, закрываемая на каждой из двух целей
max_adds = 0
min_stop_atr = 1.5        # общая геометрия стопа: стоп за точкой C тоже расширяется до волатильности,
min_stop_ticks = 10      # но цели мидпоинта и D остаются на своих абсолютных ценах
stop_beyond_bar = 1.0
max_stop_atr = 6.0

# Общая геометрия стопа применяется в одной точке планирования ко всем профилям:
# пол = max(min_stop_atr × ATR, min_stop_ticks × tick, stop_beyond_bar × диапазон бара),
# потолок = max_stop_atr × ATR. Значения подобраны по реальным барам NG 15m:
# медианный ATR(14) ≈ 0.009 (9 тиков), медианный диапазон бара ≈ 0.008 (8 тиков),
# поэтому пол в 10 тиков держит стоп шире медианного бара, а потолок в 6 × ATR
# на реальном корпусе не срабатывает ни разу и остаётся страховкой.
